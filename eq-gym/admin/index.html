<script>
const SUPA_URL="https://dpzlwlaekhfmorckukfm.supabase.co";
const SUPA_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwemx3bGFla2hmbW9yY2t1a2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTk3NDMsImV4cCI6MjEwNTAzNTc0M30.BCSyd379ekTdrY3UKR9UCI72XGU6-xI02RldLSEYCIw";
const sb=window.supabase.createClient(SUPA_URL,SUPA_ANON,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const PAGE_SIZE=10;

let AUTH=null;         // {id,email,role}
let STATE='loading';   // loading | signin | forbidden | ready
let UI={
  view:'overview', userId:null, histMore:30,
  usersSearch:'', usersSort:'created_desc', usersPage:0, usersRole:'all', usersStatus:'all', usersTier:'all',
  vouchersSearch:'', vouchersSort:'date_desc', vouchersPage:0, editVoucherId:null,
  txSearch:'', txSort:'date_desc', txPage:0, txStatus:'all', txMethod:'all', txPeriod:'all',
  affStatus:'pending', affSearch:'', affPage:0, affBusy:false
};
let DATA={dash:null,vouchers:null,users:null,usersTotal:0,tx:null,txTotal:0,txSum:null,user:null,aff:null,affTotal:0,affStats:null,settings:null};
let MSG='';
let _txSeq=0, _usersSeq=0;

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmt=n=>(n||0).toLocaleString('vi-VN');
const LOGO=`<svg width="26" height="26" viewBox="0 0 100 100"><rect x="10" y="18" width="9" height="64" rx="4.5" fill="#0F1923"/><rect x="10" y="18" width="32" height="9" rx="4.5" fill="#0F1923"/><rect x="10" y="45" width="26" height="9" rx="4.5" fill="#0F1923"/><rect x="10" y="73" width="32" height="9" rx="4.5" fill="#0F1923"/><circle cx="70" cy="50" r="22" fill="none" stroke="#0FB89B" stroke-width="9"/><circle cx="70" cy="50" r="5" fill="#E85B5B"/></svg>`;
const LOGOW=`<svg width="26" height="26" viewBox="0 0 100 100"><rect x="10" y="18" width="9" height="64" rx="4.5" fill="#fff"/><rect x="10" y="18" width="32" height="9" rx="4.5" fill="#fff"/><rect x="10" y="45" width="26" height="9" rx="4.5" fill="#fff"/><rect x="10" y="73" width="32" height="9" rx="4.5" fill="#fff"/><circle cx="70" cy="50" r="22" fill="none" stroke="#0FB89B" stroke-width="9"/><circle cx="70" cy="50" r="5" fill="#E85B5B"/></svg>`;

function cleanAuthParams(){
  try{
    const url=new URL(location.href);
    ['code','state','access_token','refresh_token','expires_in','expires_at','token_type','type','provider_token','provider_refresh_token','error','error_code','error_description'].forEach(k=>url.searchParams.delete(k));
    url.hash='';
    if(url.href!==location.href) history.replaceState(null,'',url.pathname+url.search);
  }catch(e){}
}

async function boot(){
  try{ const qp=new URLSearchParams(location.search); const oe=qp.get('error'); if(oe) MSG='Đăng nhập lỗi: '+(qp.get('error_description')||oe).replace(/\+/g,' '); }catch(e){}
  const {data}=await sb.auth.getSession();
  await applySession(data.session);
  cleanAuthParams();
  sb.auth.onAuthStateChange((_e,session)=>{ applySession(session); });
}
async function applySession(session){
  if(session&&session.user){
    const u=session.user; let prof=null;
    try{ const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){}
    if(!prof){ try{ await sb.from('profiles').upsert({id:u.id,email:u.email}); const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){} }
    AUTH={id:u.id,email:u.email,role:prof&&prof.role};
    STATE=(AUTH.role==='admin'||AUTH.role==='super_admin')?'ready':'forbidden';
    if(STATE==='ready') loadAll();
  } else { AUTH=null; STATE='signin'; }
  render();
}
async function signInEmail(){
  const email=($('authemail')&&$('authemail').value||'').trim();
  if(!email||!/.+@.+\..+/.test(email)){ MSG='Nhập email hợp lệ'; render(); return; }
  try{ const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}}); if(error) throw error; MSG='Đã gửi liên kết đăng nhập — mở email và bấm vào link.'; }
  catch(e){ MSG='Lỗi: '+e.message; }
  render();
}
async function signInGoogle(){ try{ await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}); }catch(e){ MSG='Lỗi Google: '+e.message; render(); } }
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} AUTH=null; STATE='signin'; render(); }

async function loadAll(){
  render();
  await expireStaleOrders();
  await loadDashboard();
  try{ const {data}=await sb.from('vouchers').select('*').order('created_at',{ascending:false}); DATA.vouchers=data||[]; }catch(e){ DATA.vouchers=[]; }
  render();
  await loadSettings();
  if(UI.view==='users') await loadUsers();
  if(UI.view==='tx') await loadTx();
  if(UI.view==='user'&&UI.userId) await loadUserDetail(UI.userId);
  if(UI.view==='affiliate') loadAffiliate();
}
/* Đơn QR bỏ dở quá hạn → đóng cho khỏi treo "Đang chờ" (SePay vẫn khớp được nếu tiền về trễ) */
async function expireStaleOrders(){
  try{ const {data}=await sb.from('payments').select('id,provider,expires_at').eq('status','pending');
    const stale=(data||[]).filter(p=>(p.provider==='payos'||p.provider==='sepay')&&p.expires_at&&new Date(p.expires_at).getTime()<Date.now()-5*60000);
    if(stale.length) await Promise.all(stale.map(p=>sb.rpc('admin_set_payment_status',{p_id:p.id,p_status:'expired'}).catch(()=>{})));
  }catch(e){}
}
async function loadDashboard(){ try{ const {data,error}=await sb.rpc('admin_dashboard'); if(error) throw error; DATA.dash=data; }catch(e){ DATA.dash={error:e.message}; } render(); }
async function loadSettings(){ try{ const {data}=await sb.from('settings').select('key,value'); const s={}; (data||[]).forEach(r=>s[r.key]=r.value); DATA.settings=s; }catch(e){ DATA.settings={}; } render(); }

/* ===== Users: phân trang + tìm kiếm + sắp xếp phía server (danh sách có thể rất dài) ===== */
const USER_SORTS={
  created_desc:{col:'created_at',asc:false,label:'Mới nhất'},
  created_asc:{col:'created_at',asc:true,label:'Cũ nhất'},
  email_asc:{col:'email',asc:true,label:'Email A-Z'},
  email_desc:{col:'email',asc:false,label:'Email Z-A'}
};
async function loadUsers(){
  const seq=++_usersSeq;
  const wasFocused=document.activeElement&&document.activeElement.id==='usersSearch';
  const sd=USER_SORTS[UI.usersSort]||USER_SORTS.created_desc;
  const nowIso=new Date().toISOString();
  let q=sb.from('profiles').select('*',{count:'exact'});
  if(UI.usersSearch.trim()) q=q.ilike('email','%'+UI.usersSearch.trim()+'%');
  if(UI.usersRole!=='all') q=UI.usersRole==='user'?q.or('role.is.null,role.eq.user'):q.eq('role',UI.usersRole);
  /* Admin/Super Admin luôn có Premium theo quyền (giống cách app tính) */
  if(UI.usersStatus==='premium') q=q.or('premium_until.gt.'+nowIso+',role.in.(admin,super_admin)');
  else if(UI.usersStatus==='free') q=q.or('premium_until.is.null,premium_until.lte.'+nowIso).or('role.is.null,role.eq.user');
  else if(UI.usersStatus==='banned') q=q.eq('banned',true);
  if(UI.usersTier!=='all') q=q.eq('affiliate_tier',UI.usersTier);
  q=q.order(sd.col,{ascending:sd.asc});
  const from=UI.usersPage*PAGE_SIZE;
  q=q.range(from,from+PAGE_SIZE-1);
  let rows=[],total=0;
  try{ const {data,count}=await q; rows=data||[]; total=count||0; }catch(e){}
  if(seq!==_usersSeq) return;
  DATA.users=rows; DATA.usersTotal=total;
  render();
  if(wasFocused) refocus('usersSearch');
}
function setUsersFilter(k,v){ UI[k]=v; UI.usersPage=0; DATA.users=null; render(); loadUsers(); }
async function loadUserDetail(id){ try{ const {data,error}=await sb.rpc('admin_user_detail',{p_user:id}); if(error) throw error; DATA.user=data||{missing:true}; }catch(e){ DATA.user={error:e.message}; } render(); }
function openUser(id){ if(!id) return; UI.view='user'; UI.userId=id; UI.histMore=30; DATA.user=null; render(); window.scrollTo(0,0); loadUserDetail(id); }
function afterUserChange(){ if(UI.view==='user'&&UI.userId) loadUserDetail(UI.userId); else loadUsers(); }
function refocus(id){ const el=$(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
function renderKeepFocus(id){ render(); refocus(id); }
let _usersSearchT=null;
function onUsersSearch(v){ UI.usersSearch=v; UI.usersPage=0; clearTimeout(_usersSearchT); _usersSearchT=setTimeout(loadUsers,350); }
function onUsersSort(v){ UI.usersSort=v; UI.usersPage=0; loadUsers(); }
function usersPageGo(d){ const maxPage=Math.max(0,Math.ceil(DATA.usersTotal/PAGE_SIZE)-1); UI.usersPage=Math.min(maxPage,Math.max(0,UI.usersPage+d)); loadUsers(); }

/* ===== Voucher: danh sách vốn nhỏ — lọc/sắp/phân trang phía client ===== */
const VOUCHER_SORTS={
  date_desc:{col:'created_at',asc:false,label:'Mới nhất'},
  date_asc:{col:'created_at',asc:true,label:'Cũ nhất'},
  code_asc:{col:'code',asc:true,label:'Mã A-Z'},
  used_desc:{col:'used_count',asc:false,label:'Dùng nhiều nhất'}
};
function applySort(arr,col,asc){ return [...arr].sort((a,b)=>{ let x=a[col],y=b[col]; if(typeof x==='string') x=x.toLowerCase(); if(typeof y==='string') y=y.toLowerCase(); if(x==null) x=asc?-Infinity:Infinity; if(y==null) y=asc?-Infinity:Infinity; if(x<y) return asc?-1:1; if(x>y) return asc?1:-1; return 0; }); }
function paginate(arr,page,pageSize){ const from=page*pageSize; return arr.slice(from,from+pageSize); }
function onVouchersSearch(v){ UI.vouchersSearch=v; UI.vouchersPage=0; renderKeepFocus('vouchersSearch'); }
function onVouchersSort(v){ UI.vouchersSort=v; UI.vouchersPage=0; render(); }
function vouchersPageGo(d){ UI.vouchersPage=Math.max(0,UI.vouchersPage+d); render(); }

/* ===== Giao dịch: lọc trạng thái / kênh / thời gian + tìm + sắp + phân trang phía server ===== */
const TX_SORTS={
  date_desc:{col:'created_at',asc:false,label:'Mới nhất'},
  date_asc:{col:'created_at',asc:true,label:'Cũ nhất'},
  amount_desc:{col:'amount',asc:false,label:'Tiền cao→thấp'},
  amount_asc:{col:'amount',asc:true,label:'Tiền thấp→cao'}
};
const TX_STATUS=[['all','Tất cả'],['approved','Đã thanh toán'],['pending','Đang chờ'],['expired','Hết hạn / huỷ'],['rejected','Từ chối']];
const TX_METHOD=[['all','Mọi kênh'],['sepay','QR SePay'],['payos','QR PayOS'],['manual','Chuyển khoản tay (cũ)'],['free','Miễn phí (voucher)']];
const TX_PERIOD=[['all','Mọi thời gian'],['today','Hôm nay'],['7d','7 ngày qua'],['30d','30 ngày qua']];
function txPeriodStart(){ const d=new Date(); d.setHours(0,0,0,0); if(UI.txPeriod==='today') return d; if(UI.txPeriod==='7d'){ d.setDate(d.getDate()-6); return d; } if(UI.txPeriod==='30d'){ d.setDate(d.getDate()-29); return d; } return null; }
function txFilter(q){
  if(UI.txStatus==='expired') q=q.in('status',['expired','cancelled']); else if(UI.txStatus!=='all') q=q.eq('status',UI.txStatus);
  if(UI.txMethod==='free') q=q.eq('amount',0).eq('status','approved');
  else if(UI.txMethod!=='all') q=q.eq('provider',UI.txMethod).gt('amount',0);
  const st=txPeriodStart(); if(st) q=q.gte('created_at',st.toISOString());
  const t=UI.txSearch.trim().replace(/[,()%*]/g,' ').trim();
  if(t) q=q.or('user_email.ilike.*'+t+'*,code.ilike.*'+t+'*');
  return q;
}
async function loadTx(){
  const seq=++_txSeq;
  const wasFocused=document.activeElement&&document.activeElement.id==='txSearch';
  const sd=TX_SORTS[UI.txSort]||TX_SORTS.date_desc;
  let q=txFilter(sb.from('payments_history').select('*',{count:'exact'})).order(sd.col,{ascending:sd.asc});
  const from=UI.txPage*PAGE_SIZE; q=q.range(from,from+PAGE_SIZE-1);
  const qs=txFilter(sb.from('payments_history').select('amount,status')).limit(5000);
  let rows=[],total=0,sum=null;
  try{ const {data,count,error}=await q; if(error) throw error; rows=data||[]; total=count||0; }catch(e){ MSG=e.message; }
  try{ const {data}=await qs; const ok=(data||[]).filter(x=>x.status==='approved'); sum={paid:ok.length,sum:ok.reduce((a,x)=>a+(x.amount||0),0)}; }catch(e){}
  if(seq!==_txSeq) return;   /* bấm lọc liên tiếp: bỏ kết quả của lần tải cũ về muộn */
  DATA.tx=rows; DATA.txTotal=total; DATA.txSum=sum;
  render();
  if(wasFocused) refocus('txSearch');
}
let _txSearchT=null;
function onTxSearch(v){ UI.txSearch=v; UI.txPage=0; clearTimeout(_txSearchT); _txSearchT=setTimeout(loadTx,350); }
function setTxFilter(k,v){ UI[k]=v; UI.txPage=0; DATA.tx=null; render(); loadTx(); }
function txPageGo(d){ const maxPage=Math.max(0,Math.ceil(DATA.txTotal/PAGE_SIZE)-1); UI.txPage=Math.min(maxPage,Math.max(0,UI.txPage+d)); loadTx(); }

/* Duyệt tay đi qua cùng hàm DB với webhook PayOS (_activate_payment): cộng hạn, trừ lượt voucher, tạo hoa hồng affiliate */
async function approvePay(id){ try{ const {error}=await sb.rpc('admin_approve_payment',{p_id:id}); if(error) throw error; loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
async function rejectPay(id){ try{ const {error}=await sb.rpc('admin_set_payment_status',{p_id:id,p_status:'rejected'}); if(error) throw error; loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
async function closeOrder(id){ if(!confirm('Đóng đơn QR này? (chỉ dùng khi chắc chắn học viên không thanh toán nữa)')) return; try{ const {error}=await sb.rpc('admin_set_payment_status',{p_id:id,p_status:'expired'}); if(error) throw error; loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
/* Hỏi lại PayOS theo orderCode — dùng khi webhook rớt mà học viên báo đã chuyển */
async function recheckOrder(id){ try{ const {data,error}=await sb.functions.invoke('payos',{body:{action:'recheck',payment_id:id}});
  if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.message||j.error||m; }catch(e){} throw new Error(m); }
  alert(data.status==='PAID'?'✅ PayOS báo ĐÃ THANH TOÁN — đã kích hoạt Premium.':data.status==='PENDING'?'⏳ PayOS chưa ghi nhận tiền về cho đơn này.':'Trạng thái PayOS: '+data.status); loadAll(); }catch(e){ alert('Lỗi đối soát: '+e.message); } }
async function createVoucher(){
  const code=($('vf_code').value||'').trim().toUpperCase(); const discount=parseInt($('vf_discount').value||'0',10); const maxRaw=($('vf_max').value||'').trim();
  if(!code||!discount){ alert('Nhập mã và số tiền giảm'); return; }
  try{ await sb.from('vouchers').insert({code,discount_amount:discount,max_uses:maxRaw?parseInt(maxRaw,10):null}); loadAll(); }catch(e){ alert('Lỗi: '+e.message); }
}
async function toggleVoucher(id,active){ try{ await sb.from('vouchers').update({active:!active}).eq('id',id); loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
function editVoucherStart(id){ UI.editVoucherId=id; render(); }
function editVoucherCancel(){ UI.editVoucherId=null; render(); }
async function saveVoucher(id){
  const code=($('ev_code_'+id).value||'').trim().toUpperCase();
  const discount=parseInt($('ev_discount_'+id).value||'0',10);
  const maxRaw=($('ev_max_'+id).value||'').trim();
  if(!code||!discount){ alert('Nhập mã và số tiền giảm'); return; }
  try{ await sb.from('vouchers').update({code,discount_amount:discount,max_uses:maxRaw?parseInt(maxRaw,10):null}).eq('id',id); UI.editVoucherId=null; loadAll(); }
  catch(e){ alert('Lỗi: '+e.message); }
}

/* ===== Super admin: đổi role / xoá Premium / khoá tài khoản ===== */
async function changeRole(uid,role){ try{ const {error}=await sb.rpc('admin_set_role',{p_user_id:uid,p_role:role}); if(error) throw error; afterUserChange(); }catch(e){ alert('Lỗi: '+e.message); afterUserChange(); } }
async function revokePremium(uid){ if(!confirm('Xoá Premium của học viên này?')) return; try{ const {error}=await sb.rpc('admin_revoke_premium',{p_user_id:uid}); if(error) throw error; afterUserChange(); }catch(e){ alert('Lỗi: '+e.message); } }
async function grantPremium(uid){
  const raw=prompt('Cấp Premium — nhập 0 = TRỌN ĐỜI, hoặc số tháng nếu chỉ cấp có thời hạn:','0');
  if(raw==null) return;
  const months=parseInt(raw,10);
  if(isNaN(months)||months<0){ alert('Số tháng không hợp lệ'); return; }
  try{ const {error}=await sb.rpc('admin_grant_premium',{p_user_id:uid,p_months:months}); if(error) throw error; afterUserChange(); }
  catch(e){ alert('Lỗi: '+e.message); }
}
async function banUser(uid,currentlyBanned){ if(!confirm(currentlyBanned?'Mở khoá tài khoản này?':'Khoá tài khoản này? Học viên sẽ không đăng nhập/luyện tập được nữa.')) return; try{ const {error}=await sb.rpc('admin_set_banned',{p_user_id:uid,p_banned:!currentlyBanned}); if(error) throw error; afterUserChange(); }catch(e){ alert('Lỗi: '+e.message); } }

function nav(v){ UI.view=v; render(); window.scrollTo(0,0); if(v==='affiliate'&&DATA.aff==null) loadAffiliate(); if(v==='tx'&&DATA.tx==null) loadTx(); if(v==='users'&&DATA.users==null) loadUsers(); if(v==='overview') loadDashboard(); }

/* ===== Affiliate: cấu hình + duyệt/chi hoa hồng ===== */
const AFF_TIERS=[['standard','Cá nhân / học viên',0.2],['partner','Tổ chức, đối tác',0.4],['trusted','Đối tác tin cậy',0.6]];
function tierRates(){ const t=(DATA.settings&&DATA.settings.affiliate_tiers)||{}; const r={}; AFF_TIERS.forEach(([k,,d])=>r[k]=t[k]!=null?+t[k]:d); return r; }
function tierLabel(k){ const t=AFF_TIERS.find(x=>x[0]===(k||'standard'))||AFF_TIERS[0]; return t[1]+' · '+Math.round(tierRates()[t[0]]*100)+'%'; }
async function setAffTier(uid,tier){ try{ const {error}=await sb.rpc('admin_set_affiliate_tier',{p_user_id:uid,p_tier:tier}); if(error) throw error; afterUserChange(); }catch(e){ alert('Lỗi: '+e.message); afterUserChange(); } }
const AFF_STATUS={pending:'Chờ duyệt',approved:'Chờ chuyển tiền',paid:'Đã trả',void:'Đã huỷ',all:'Tất cả'};
async function loadAffiliate(){
  const wasFocused=document.activeElement&&document.activeElement.id==='affSearch';
  try{ const {data}=await sb.rpc('admin_affiliate_stats'); DATA.affStats=(data&&data[0])||null; }catch(e){}
  let q=sb.from('affiliate_commissions_admin').select('*',{count:'exact'});
  if(UI.affStatus!=='all') q=q.eq('status',UI.affStatus);
  if(UI.affSearch.trim()) q=q.ilike('referrer_email','%'+UI.affSearch.trim()+'%');
  q=q.order('created_at',{ascending:false});
  const from=UI.affPage*PAGE_SIZE; q=q.range(from,from+PAGE_SIZE-1);
  try{ const {data,count,error}=await q; if(error) throw error; DATA.aff=data||[]; DATA.affTotal=count||0; }catch(e){ DATA.aff=[]; DATA.affTotal=0; MSG=e.message; }
  render();
  if(wasFocused) refocus('affSearch');
}
let _affSearchT=null;
function onAffSearch(v){ UI.affSearch=v; UI.affPage=0; clearTimeout(_affSearchT); _affSearchT=setTimeout(loadAffiliate,350); }
function setAffStatus(s){ UI.affStatus=s; UI.affPage=0; loadAffiliate(); }

async function setCommission(id,status){
  const msg={approved:'Duyệt khoản hoa hồng này? (chuyển sang "Chờ chuyển tiền")',paid:'Đánh dấu ĐÃ CHUYỂN TIỀN cho khoản này?',void:'Huỷ khoản hoa hồng này? (gian lận / đơn hoàn tiền)',pending:'Khôi phục về "Chờ duyệt"?'}[status];
  if(msg&&!confirm(msg)) return;
  try{ const {error}=await sb.rpc('admin_set_commission_status',{p_id:id,p_status:status}); if(error) throw error; loadAffiliate(); }catch(e){ alert('Lỗi: '+e.message); }

async function saveAffSettings(){
  if(AUTH.role!=='super_admin'){ alert('Chỉ Super Admin được sửa cấu hình affiliate'); return; }
  const tiers={}; for(const [k,label] of AFF_TIERS){ const v=parseFloat(($('as_tier_'+k).value||'').replace(',','.'))/100; if(isNaN(v)||v<0||v>1){ alert('% hoa hồng "'+label+'" phải từ 0 đến 100'); return; } tiers[k]=Math.round(v*10000)/10000; }
  const disc=parseInt($('as_disc').value||'0',10), hold=parseInt($('as_hold').value||'0',10);
  const now=new Date().toISOString();
  const rows=[{key:'affiliate_enabled',value:$('as_enabled').checked},{key:'affiliate_tiers',value:tiers},{key:'affiliate_rate',value:tiers.standard},{key:'affiliate_referee_discount',value:disc||0},{key:'affiliate_hold_days',value:hold||0}].map(r=>({...r,updated_at:now}));
  UI.affBusy=true; render();
  try{ const {error}=await sb.from('settings').upsert(rows); if(error) throw error; await loadSettings(); alert('Đã lưu cấu hình affiliate'); }catch(e){ alert('Lỗi: '+e.message); }
  UI.affBusy=false; render();
}
/* Xuất danh sách "Chờ chuyển tiền" gộp theo người nhận → chị chuyển khoản theo file này rồi bấm "Đã trả" từng khoản */
async function exportAffCsv(){
  try{
    const {data,error}=await sb.from('affiliate_commissions_admin').select('*').eq('status','approved').order('referrer_email').limit(2000);
    if(error) throw error; if(!data||!data.length){ alert('Không có khoản nào đang chờ chuyển tiền.'); return; }
    const by={}; data.forEach(c=>{ const k=c.referrer_id; by[k]=by[k]||{email:c.referrer_email,payout:c.referrer_payout||{},n:0,sum:0}; by[k].n++; by[k].sum+=c.commission||0; });
    const rows=[['Email','Ngân hàng','Số tài khoản','Chủ tài khoản','Số khoản','Tổng hoa hồng (đ)']];
    Object.values(by).forEach(r=>rows.push([r.email||'',r.payout.bank||'',r.payout.account||'',r.payout.name||'',r.n,r.sum]));
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='eqgym-hoa-hong-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('Lỗi xuất file: '+e.message); }
}

/* ===== helper hiển thị ===== */
const METHOD_LABEL={sepay:'QR SePay',payos:'QR PayOS',manual:'Chuyển khoản tay',free:'Miễn phí (voucher)'};
const METHOD_COLOR={sepay:'#0FB89B',payos:'#4A9EFF',manual:'#8A97A5',free:'#E0930A'};
const ROLE_LABEL={user:'Học viên',admin:'Admin',super_admin:'Super Admin'};
function fdt(ts){ return ts?new Date(ts).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}):'—'; }
function fd(ts){ return ts?new Date(ts).toLocaleDateString('vi-VN'):'—'; }
function ago(ts){ if(!ts) return '—'; const m=Math.round((Date.now()-new Date(ts).getTime())/60000); if(m<1) return 'vừa xong'; if(m<60) return m+' phút trước'; const h=Math.round(m/60); if(h<24) return h+' giờ trước'; const d=Math.round(h/24); if(d<30) return d+' ngày trước'; return fd(ts); }
function isLife(d){ return !!d&&new Date(d).getFullYear()>=2900; }
function premText(u){ if(u.role==='admin'||u.role==='super_admin') return 'Premium theo quyền'; if(!u.premium_until) return 'Miễn phí'; if(new Date(u.premium_until)<=new Date()) return 'Hết hạn '+fd(u.premium_until); return isLife(u.premium_until)?'Premium trọn đời':'Premium đến '+fd(u.premium_until); }
function isPremU(u){ return u.role==='admin'||u.role==='super_admin'||(u.premium_until&&new Date(u.premium_until)>new Date()); }
function shortMoney(n){ n=+n||0; if(n>=1e9) return (n/1e9).toFixed(1).replace('.0','')+' tỷ'; if(n>=1e6) return (n/1e6).toFixed(1).replace('.0','')+'tr'; if(n>=1e3) return Math.round(n/1e3)+'k'; return String(n); }
function methodOf(p){ return (p.amount||0)===0&&p.status==='approved'?'free':(p.provider||'manual'); }
function txStatusPill(p){ const free=p.status==='approved'&&(p.amount||0)===0;
  if(free) return pill('Miễn phí · voucher','good'); if(p.status==='approved') return pill('Đã thanh toán','good');
  if(p.status==='pending') return pill('Đang chờ','off'); if(p.status==='rejected') return pill('Từ chối','warn'); return pill(p.status==='cancelled'?'Đã huỷ':'Hết hạn','off'); }
function chip(label,active,onclick){ return `<button onclick="${onclick}" style="flex:0 0 auto;white-space:nowrap;border:1px solid ${active?'#0FB89B':'#E3E8EE'};border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:800;cursor:pointer;background:${active?'#EAFBF6':'#fff'};color:${active?'#0A6E5D':'#5C6B7A'}">${label}</button>`; }
function sel(id,opts,val,onchange){ return `<select id="${id}" onchange="${onchange}" style="flex:1;min-width:0;background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:9px 8px;font-size:12px;font-weight:700;color:#0F1923">${opts.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('')}</select>`; }
function secTitle(t,right){ return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px"><h3 style="margin:0;font-family:'Space Grotesk';font-size:14px;font-weight:700">${t}</h3>${right||''}</div>`; }
/* Cột theo ngày (SVG), di chuột/chạm xem số */
function barChart(rows,key,color,fmtFn){
  const vals=rows.map(r=>+r[key]||0), max=Math.max(1,...vals), W=300, H=80, n=vals.length, bw=W/n;
  const bars=vals.map((v,i)=>{ const h=v?Math.max(2,Math.round(v/max*(H-4))):0; return `<rect x="${(i*bw+1).toFixed(1)}" y="${H-h}" width="${(bw-2).toFixed(1)}" height="${h}" rx="1.5" fill="${color}" opacity="${i===n-1?1:.75}"><title>${rows[i].d}: ${fmtFn(v)}</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block"><line x1="0" y1="${H-.5}" x2="${W}" y2="${H-.5}" stroke="#E3E8EE"/>${bars}</svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#8A97A5;font-weight:700;margin-top:4px"><span>${rows[0]?rows[0].d:''}</span><span>Cao nhất ${fmtFn(max)}</span><span>${rows[n-1]?rows[n-1].d:''}</span></div>`;
}
function kpi(label,value,sub,color){ return `<div style="background:#fff;border:1px solid #E3E8EE;border-radius:16px;padding:12px 13px">
  <div style="font-size:10.5px;color:#5C6B7A;font-weight:800;text-transform:uppercase;letter-spacing:.4px">${label}</div>
  <div style="font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:3px;color:${color||'#0F1923'}">${value}</div>
  ${sub?`<div style="font-size:11px;color:#8A97A5;font-weight:700;margin-top:2px;line-height:1.35">${sub}</div>`:''}</div>`; }

function userTimeline(x){
  const ev=[], p=x.profile||{};
  if(p.created_at) ev.push([p.created_at,'🆕','Tạo tài khoản',p.provider==='google'?'Đăng nhập Google':p.provider==='email'?'Đăng nhập bằng email':'']);

  if(p.referred_at) ev.push([p.referred_at,'🤝','Được giới thiệu bởi '+(p.referred_by_email||'—'),'']);
  (x.payments||[]).forEach(t=>{ const m=(t.amount||0)===0&&t.status==='approved'?'free':t.provider;
    if(t.status==='approved') ev.push([t.paid_at||t.created_at,'💳',(m==='free'?'Nâng cấp Premium bằng voucher ':'Thanh toán thành công '+fmt(t.amount)+'đ ')+(t.voucher_code?'· '+t.voucher_code:''),(METHOD_LABEL[m]||m)+' · '+(t.code||'')+(t.manual?' · duyệt tay':'')]);
    else ev.push([t.created_at,t.status==='pending'?'🧾':'⏱',(t.status==='pending'?'Tạo đơn chờ thanh toán ':t.status==='rejected'?'Đơn bị từ chối ':'Đơn hết hạn / huỷ ')+fmt(t.amount)+'đ',(METHOD_LABEL[t.provider]||t.provider)+' · '+(t.code||'')+(t.note?' · '+t.note:'')]); });
  (x.practices||[]).forEach(r=>ev.push([r.created_at,'✍️','Luyện tập buổi '+r.lesson_n+' · '+r.score+' điểm',/gemini|ai|coach/i.test(r.by||'')?'Coach AI chấm':'Chấm tự động']));
  (x.assessments||[]).forEach(a=>ev.push([a.created_at,'🧭','Làm bài test EQ · '+(a.total!=null?a.total+'/100':'')+(a.band?' · '+a.band:''),'']));
  const certs=(x.progress&&x.progress.certs)||{}; Object.keys(certs).forEach(k=>{ const c=certs[k]||{}; if(c.ts) ev.push([new Date(c.ts).toISOString(),'🎓','Nhận chứng nhận '+(c.title||k+' ngày'),k+' ngày luyện tập liên tục']); });
  (x.referred||[]).forEach(r=>ev.push([r.at,'📣','Giới thiệu '+(r.email||'—')+(r.premium?' · đã mua':''),'']));
  (x.commissions||[]).forEach(c=>ev.push([c.created_at,'💰','Hoa hồng '+fmt(c.commission)+'đ ('+Math.round(c.rate*100)+'%)',{pending:'Chờ duyệt',approved:'Chờ chuyển tiền',paid:'Đã trả',void:'Đã huỷ'}[c.status]||c.status]));
  return ev.filter(e=>e[0]).sort((a,b)=>new Date(b[0])-new Date(a[0]));
}

    <button onclick="loadUserDetail(UI.userId)" style="width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E3E8EE;font-size:15px;cursor:pointer" title="Làm mới">↻</button></div>`;
  h+=`<div style="padding:12px 16px 90px">`;
  if(!x){ return h+`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p></div>`; }
  if(x.error||x.missing){ return h+card(`<b>Không tải được tài khoản</b><div style="font-size:12px;color:#C74848;margin-top:4px">${esc(x.error||'Tài khoản không tồn tại')}</div>`)+`</div>`; }
  const p=x.profile, g=x.progress||{}, st=g.state||{}, done=(g.done||[]).map(Number), isSuper=AUTH.role==='super_admin', isSelf=p.id===AUTH.id, prem=isPremU(p);
  h+=card(`<div style="display:flex;align-items:center;gap:12px">${avatar(p.email,48)}<div style="min-width:0;flex:1">
      <div style="font-size:15px;font-weight:800;overflow-wrap:anywhere">${esc(p.email)}${isSelf?' (bạn)':''}</div>
      ${p.display_name?`<div style="font-size:12px;color:#5C6B7A;font-weight:700">${esc(p.display_name)}</div>`:''}
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${pill(ROLE_LABEL[p.role||'user']||esc(p.role),p.role&&p.role!=='user'?'good':'off')}${p.banned?pill('Đã khoá','warn'):pill(premText(p),prem?'good':'off')}${p.affiliate_tier&&p.affiliate_tier!=='standard'?pill('🤝 '+esc(tierLabel(p.affiliate_tier)),'good'):''}</div></div></div>
    <div style="margin-top:10px">
      ${infoRow('Ngày tạo',fdt(p.created_at))}${infoRow('Đăng nhập gần nhất',p.last_sign_in_at?fdt(p.last_sign_in_at)+' · '+ago(p.last_sign_in_at):'—')}
      ${infoRow('Cách đăng nhập',p.provider==='google'?'Google':p.provider==='email'?'Email (link)':esc(p.provider||'—'))}
      ${infoRow('Mã giới thiệu',esc(p.ref_code||'—'))}${infoRow('Được giới thiệu bởi',esc(p.referred_by_email||'—'))}
      ${infoRow('TK nhận hoa hồng',p.payout_info&&p.payout_info.account?esc((p.payout_info.bank||'')+' · '+p.payout_info.account+' · '+(p.payout_info.name||'')):'—')}
    </div>`);
  if(isSuper&&!isSelf) h+=card(`<div style="font-size:11px;color:#5C6B7A;font-weight:800;margin-bottom:8px">THAO TÁC (SUPER ADMIN)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select onchange="changeRole('${p.id}',this.value)" style="flex:1;min-width:130px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:9px;padding:9px;font-size:12px;font-weight:700">
          ${Object.entries(ROLE_LABEL).map(([k,l])=>`<option value="${k}" ${(p.role||'user')===k?'selected':''}>${l}</option>`).join('')}</select>
        <select onchange="setAffTier('${p.id}',this.value)" style="flex:1;min-width:160px;background:#FFF8EA;border:1px solid #F3DDAE;border-radius:9px;padding:9px;font-size:12px;font-weight:700">
          ${AFF_TIERS.map(([k])=>`<option value="${k}" ${(p.affiliate_tier||'standard')===k?'selected':''}>🤝 ${esc(tierLabel(k))}</option>`).join('')}</select>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button onclick="grantPremium('${p.id}')" style="flex:1;border:1px solid #E3E8EE;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#0A6E5D">+ Premium</button>
        ${p.premium_until&&new Date(p.premium_until)>new Date()?`<button onclick="revokePremium('${p.id}')" style="flex:1;border:1px solid #E3E8EE;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#C74848">Xoá Premium</button>`:''}
        <button onclick="banUser('${p.id}',${!!p.banned})" style="flex:1;border:1px solid #E3E8EE;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:${p.banned?'#0A6E5D':'#C74848'}">${p.banned?'Mở khoá':'Khoá'}</button>
      </div>`);
  h+=secTitle('Tiến độ học',g.updated_at?`<span style="font-size:11px;color:#8A97A5;font-weight:700">Hoạt động ${ago(g.updated_at)}</span>`:'');
  h+=card(!x.progress?`<p style="margin:0;color:#8A97A5;font-size:12.5px;font-weight:600">Chưa bắt đầu học.</p>`:`
    <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800"><span>Đã hoàn thành</span><span>${done.length}/30 buổi</span></div>
    <div style="height:8px;background:#EEF2F6;border-radius:6px;margin-top:6px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(done.length/30*100)}%;background:linear-gradient(90deg,#0FB89B,#0A8C77)"></i></div>
    <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:10px">${Array.from({length:30},(_,i)=>`<div title="Buổi ${i}" style="aspect-ratio:1;border-radius:4px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;background:${done.includes(i)?'#0FB89B':'#EEF2F6'};color:${done.includes(i)?'#fff':'#9AA6B2'}">${i}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center">
      ${[['EP',fmt(g.bounty)],['Chuỗi hiện tại',(g.streak||0)+' ngày'],['Kỷ lục chuỗi',(st.bestStreak||g.streak||0)+' ngày'],['Ngày nghỉ phép',st.freezes!=null?st.freezes:'—'],['Bài luyện tập',x.practices_total],['Chứng nhận',Object.keys(g.certs||{}).length]].map(([k,v])=>`<div style="background:#F5F8FA;border-radius:12px;padding:8px 4px"><b style="display:block;font-family:'Space Grotesk';font-size:15px">${v}</b><span style="font-size:10px;color:#5C6B7A;font-weight:700">${k}</span></div>`).join('')}
    </div>`);
  const ev=userTimeline(x);
  h+=secTitle('Lịch sử hoạt động',`<span style="font-size:11px;color:#8A97A5;font-weight:700">${ev.length} sự kiện</span>`);
  h+=card(ev.length?`<div style="position:relative;padding-left:4px">${ev.slice(0,UI.histMore).map(e=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0F3F6">
      <div style="flex:0 0 26px;height:26px;border-radius:50%;background:#F5F8FA;display:flex;align-items:center;justify-content:center;font-size:13px">${e[1]}</div>
      <div style="min-width:0;flex:1"><div style="font-size:12.5px;font-weight:800;overflow-wrap:anywhere">${esc(e[2])}</div>
        <div style="font-size:10.5px;color:#8A97A5;font-weight:700;margin-top:1px">${fdt(e[0])}${e[3]?' · '+esc(e[3]):''}</div></div></div>`).join('')}</div>
    ${ev.length>UI.histMore?`<button onclick="UI.histMore+=30;render()" style="width:100%;margin-top:8px;border:1px solid #E3E8EE;border-radius:10px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#5C6B7A">Xem thêm (${ev.length-UI.histMore})</button>`:''}`
    :`<p style="margin:0;color:#8A97A5;font-size:12.5px;font-weight:600">Chưa có hoạt động.</p>`);
  if((x.payments||[]).length){
    h+=secTitle('Giao dịch',`<span style="font-size:11px;color:#8A97A5;font-weight:700">${x.payments.length} đơn</span>`);
    h+=card(x.payments.map(t=>{ const m=(t.amount||0)===0&&t.status==='approved'?'free':t.provider; return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0F3F6">
      <div style="min-width:0"><div style="font-size:12.5px;font-weight:800">${esc(t.code||'—')} · ${fmt(t.amount)}đ</div><div style="font-size:10.5px;color:#8A97A5;font-weight:700">${METHOD_LABEL[m]||esc(m)} · ${fdt(t.created_at)}${t.voucher_code?' · '+esc(t.voucher_code):''}</div></div>
      ${txStatusPill(t)}</div>`; }).join(''));
  }
  if((x.referred||[]).length||(x.commissions||[]).length){
    const sum=(s)=>(x.commissions||[]).filter(c=>s.includes(c.status)).reduce((a,c)=>a+(c.commission||0),0);
    h+=secTitle('Affiliate');
    h+=card(`<div style="display:flex;gap:8px;text-align:center">${[['Đã giới thiệu',(x.referred||[]).length],['Chờ trả',fmt(sum(['pending','approved']))+'đ'],['Đã nhận',fmt(sum(['paid']))+'đ']].map(([k,v])=>`<div style="flex:1;background:#F5F8FA;border-radius:12px;padding:8px 4px"><b style="display:block;font-family:'Space Grotesk';font-size:14px">${v}</b><span style="font-size:10px;color:#5C6B7A;font-weight:700">${k}</span></div>`).join('')}</div>`);
  }
  return h+`</div>`;
}
function viewAffiliate(){
  const s=DATA.settings||{}, st=DATA.affStats;
  let h=header('Affiliate','Mã giới thiệu & hoa hồng');
  h+=`<div style="padding:14px 16px 90px">`;
  if(st) h+=`<div style="display:flex;gap:8px;margin-bottom:12px">
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#E0930A">${fmt(st.pending_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Chờ duyệt</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#C74848">${fmt(st.approved_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Chờ chuyển</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#0A8C77">${fmt(st.paid_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Đã trả</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
    </div><div style="font-size:11.5px;color:#5C6B7A;font-weight:700;margin:-4px 2px 12px">${fmt(st.referrers)} người đã có hoa hồng · ${fmt(st.referred_users)} học viên vào qua giới thiệu</div>`;
  const inp='background:#F5F8FA;border:1px solid #E3E8EE;border-radius:11px;padding:10px;font-size:13px;width:100%';
  const tr=tierRates(), disc=s.affiliate_referee_discount!=null?+s.affiliate_referee_discount:50000, hold=s.affiliate_hold_days!=null?+s.affiliate_hold_days:7, on=s.affiliate_enabled!==false, su=AUTH.role==='super_admin', dis=su?'':'disabled';
  h+=card(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:13.5px">⚙️ Cấu hình chương trình</b><label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:${on?'#0A6E5D':'#5C6B7A'}"><input type="checkbox" id="as_enabled" ${on?'checked':''} ${dis} style="width:18px;height:18px;accent-color:#0FB89B">Đang bật</label></div>
    <div style="font-size:11px;color:#5C6B7A;font-weight:800;margin-bottom:6px">% hoa hồng theo hạng người giới thiệu</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      ${AFF_TIERS.map(([k,label])=>`<label style="font-size:10.5px;color:#5C6B7A;font-weight:700;line-height:1.3">${label}<input id="as_tier_${k}" type="number" step="0.5" min="0" max="100" value="${Math.round(tr[k]*1000)/10}" ${dis} style="${inp};margin-top:4px"></label>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <label style="font-size:10.5px;color:#5C6B7A;font-weight:700">Giảm người mới (đ)<input id="as_disc" type="number" min="0" step="1000" value="${disc}" ${dis} style="${inp};margin-top:4px"></label>
      <label style="font-size:10.5px;color:#5C6B7A;font-weight:700">Giữ (ngày)<input id="as_hold" type="number" min="0" value="${hold}" ${dis} style="${inp};margin-top:4px"></label>
    </div>
    <p style="margin:8px 0 0;font-size:11px;color:#8A97A5;font-weight:600;line-height:1.5">Mỗi học viên có sẵn mã giới thiệu 6 ký tự, mặc định hạng Cá nhân. Đổi hạng từng người ở tab Học viên. Người mới nhập mã khi nâng cấp lần đầu được giảm; người giới thiệu nhận % theo hạng trên số tiền thực trả. "Giữ" = số ngày sau thanh toán mới nên duyệt (phòng hoàn tiền).</p>
    ${su?`<button onclick="saveAffSettings()" ${UI.affBusy?'disabled':''} style="width:100%;margin-top:10px;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;min-height:44px;opacity:${UI.affBusy?.6:1}">${UI.affBusy?'Đang lưu...':'Lưu cấu hình'}</button>`:`<p style="margin:10px 0 0;font-size:11.5px;color:#B25E09;font-weight:700">🔒 Chỉ Super Admin được sửa cấu hình.</p>`}`);
  h+=`<div style="display:flex;gap:5px;margin-bottom:10px;overflow-x:auto">${Object.entries(AFF_STATUS).map(([v,l])=>`<button onclick="setAffStatus('${v}')" style="flex:1;white-space:nowrap;border:1px solid ${UI.affStatus===v?'#0FB89B':'#E3E8EE'};border-radius:10px;padding:8px 9px;font-size:11px;font-weight:800;cursor:pointer;background:${UI.affStatus===v?'#EAFBF6':'#fff'};color:${UI.affStatus===v?'#0A6E5D':'#5C6B7A'}">${l}</button>`).join('')}</div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="affSearch" value="${esc(UI.affSearch)}" oninput="onAffSearch(this.value)" placeholder="Tìm theo email người giới thiệu..." style="flex:1;min-width:0;background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:11px 13px;font-size:13px">
    ${UI.affStatus==='approved'?`<button onclick="exportAffCsv()" style="border:none;border-radius:12px;padding:0 12px;font-size:12px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;white-space:nowrap">⬇ CSV chuyển tiền</button>`:''}</div>`;
  if(DATA.aff==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.aff.length) h+=`<p style="color:#5C6B7A;font-weight:600;text-align:center;padding:20px 0">Chưa có khoản hoa hồng nào${UI.affStatus!=='all'?' ở trạng thái này':''}.</p>`;
  else DATA.aff.forEach(c=>{
    const po=c.referrer_payout||{}; const ready=!c.available_at||new Date(c.available_at)<=new Date();
    const sp=c.status==='paid'?pill('Đã trả','good'):c.status==='approved'?pill('Chờ chuyển','warn'):c.status==='void'?pill('Đã huỷ','off'):pill(ready?'Có thể duyệt':'Đang giữ','off');
    const btn=(t,fn,dark)=>`<button onclick="${fn}" style="flex:1;border:${dark?'none':'1px solid #E3E8EE'};border-radius:10px;padding:9px 8px;font-size:11.5px;font-weight:800;cursor:pointer;background:${dark?'#0F1923':'#fff'};color:${dark?'#fff':'#5C6B7A'};min-height:38px">${t}</button>`;
    let acts='';
    if(c.status==='pending') acts=btn(ready?'Duyệt':'Duyệt sớm',`setCommission('${c.id}','approved')`,true)+btn('Huỷ',`setCommission('${c.id}','void')`);
    else if(c.status==='approved') acts=btn('✓ Đã chuyển tiền',`setCommission('${c.id}','paid')`,true)+btn('Huỷ',`setCommission('${c.id}','void')`);
    else if(c.status==='void') acts=btn('Khôi phục',`setCommission('${c.id}','pending')`);
    h+=card(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.referrer_email||c.referrer_id)}</div>
        <div style="font-size:10.5px;color:#5C6B7A;font-weight:600;margin-top:2px">giới thiệu ${esc(c.referee_email||'—')} · ${new Date(c.created_at).toLocaleDateString('vi-VN')}</div></div>${sp}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><span style="font-size:11.5px;color:#5C6B7A;font-weight:700">${Math.round(+c.rate*100)}% × ${fmt(c.amount_paid)}đ</span><b style="font-family:'Space Grotesk';font-size:17px;color:#E0930A">${fmt(c.commission)}đ</b></div>
      ${c.status==='pending'&&!ready?`<div style="font-size:10.5px;color:#8A97A5;font-weight:600;margin-top:2px">Nên duyệt từ ${new Date(c.available_at).toLocaleDateString('vi-VN')}</div>`:''}
      ${c.status==='approved'?`<div style="margin-top:6px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:10px;padding:8px 10px;font-size:11.5px;font-weight:600;line-height:1.5">${po.account?`Chuyển tới: <b>${esc(po.bank||'')}</b> · <b>${esc(po.account)}</b> · ${esc(po.name||'')}`:'<span style="color:#C74848">Người nhận chưa nhập tài khoản ngân hàng</span>'}</div>`:''}
      ${c.paid_at?`<div style="font-size:10.5px;color:#8A97A5;font-weight:600;margin-top:4px">Đã chuyển lúc ${new Date(c.paid_at).toLocaleString('vi-VN')}</div>`:''}
      ${acts?`<div style="display:flex;gap:6px;margin-top:10px">${acts}</div>`:''}`,'padding:12px 14px');
  });
  h+=pager(UI.affPage,DATA.affTotal,PAGE_SIZE,'affPageGo(-1)','affPageGo(1)');
  h+=`</div>`;
  return h;
}

function renderDashboard(){
  let main='';
  if(UI.view==='overview') main=viewOverview();
  else if(UI.view==='tx') main=viewTx();
  else if(UI.view==='vouchers') main=viewVouchers();
  else if(UI.view==='affiliate') main=viewAffiliate();
  else if(UI.view==='users') main=viewUsers();
  else if(UI.view==='user') main=viewUser();
  return `<div style="min-height:100vh;max-width:480px;margin:0 auto;position:relative;background:#F5F8FA;box-shadow:0 0 40px rgba(15,25,35,.08)">${main}</div>${bottomNav()}`;
}

function render(){
  const app=$('app');
  if(STATE==='loading') app.innerHTML=`<div style="min-height:100vh;max-width:480px;margin:0 auto;background:#F5F8FA"></div>`;
  else if(STATE==='signin') app.innerHTML=renderGate();
  else if(STATE==='forbidden') app.innerHTML=renderForbidden();
  else app.innerHTML=renderDashboard();
}

render();
boot();
</script>
</body>
</html>
