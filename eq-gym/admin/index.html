<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
html,body{margin:0;padding:0;background:#E9EDF2}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;color:#0F1923;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:#0A6E5D;text-decoration:none}
input{font-family:'Nunito',sans-serif}
input:focus{outline:none;border-color:#0FB89B !important}

table{width:100%;border-collapse:collapse}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPA_URL="https://dpzlwlaekhfmorckukfm.supabase.co";
const SUPA_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwemx3bGFla2hmbW9yY2t1a2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTk3NDMsImV4cCI6MjEwNTAzNTc0M30.BCSyd379ekTdrY3UKR9UCI72XGU6-xI02RldLSEYCIw";
const sb=window.supabase.createClient(SUPA_URL,SUPA_ANON,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});

let AUTH=null;         // {id,email,role}
let STATE='loading';   // loading | signin | forbidden | ready
let UI={view:'overview'};
let DATA={stats:null,pending:null,vouchers:null,users:null};
let MSG='';

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>(n||0).toLocaleString('vi-VN');
const LOGO=`<svg width="26" height="26" viewBox="0 0 100 100"><rect x="10" y="18" width="9" height="64" rx="4.5" fill="#0F1923"/><rect x="10" y="18" width="32" height="9" rx="4.5" fill="#0F1923"/><rect x="10" y="45" width="26" height="9" rx="4.5" fill="#0F1923"/><rect x="10" y="73" width="32" height="9" rx="4.5" fill="#0F1923"/><circle cx="70" cy="50" r="22" fill="none" stroke="#0FB89B" stroke-width="9"/><circle cx="70" cy="50" r="5" fill="#E85B5B"/></svg>`;
const LOGOW=`<svg width="26" height="26" viewBox="0 0 100 100"><rect x="10" y="18" width="9" height="64" rx="4.5" fill="#fff"/><rect x="10" y="18" width="32" height="9" rx="4.5" fill="#fff"/><rect x="10" y="45" width="26" height="9" rx="4.5" fill="#fff"/><rect x="10" y="73" width="32" height="9" rx="4.5" fill="#fff"/><circle cx="70" cy="50" r="22" fill="none" stroke="#0FB89B" stroke-width="9"/><circle cx="70" cy="50" r="5" fill="#E85B5B"/></svg>`;

function cleanAuthParams(){
  try{
    const url=new URL(location.href);
    ['code','state','access_token','refresh_token','expires_in','expires_at','token_type','type','provider_token','provider_refresh_token','error','error_code','error_description'].forEach(k=>url.searchParams.delete(k));
    url.hash='';
    if(url.href!==location.href) history.replaceState(null,'',url.pathname+url.search);
  }catch(e){}
}

async function boot(){
  try{ const qp=new URLSearchParams(location.search); const oe=qp.get('error'); if(oe) MSG='Đăng nhập lỗi: '+(qp.get('error_description')||oe).replace(/\+/g,' '); }catch(e){}
  const {data}=await sb.auth.getSession();
  await applySession(data.session);
  cleanAuthParams();
  sb.auth.onAuthStateChange((_e,session)=>{ applySession(session); });
}
async function applySession(session){
  if(session&&session.user){
    const u=session.user; let prof=null;
    try{ const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){}
    if(!prof){ try{ await sb.from('profiles').upsert({id:u.id,email:u.email}); const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){} }
    AUTH={id:u.id,email:u.email,role:prof&&prof.role};
    STATE=(AUTH.role==='admin')?'ready':'forbidden';
    if(STATE==='ready') loadAll();
  } else { AUTH=null; STATE='signin'; }
  render();
}
async function signInEmail(){
  const email=($('authemail')&&$('authemail').value||'').trim();
  if(!email||!/.+@.+\..+/.test(email)){ MSG='Nhập email hợp lệ'; render(); return; }
  try{ const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}}); if(error) throw error; MSG='Đã gửi liên kết đăng nhập — mở email và bấm vào link.'; }
  catch(e){ MSG='Lỗi: '+e.message; }
  render();
}
async function signInGoogle(){ try{ await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}); }catch(e){ MSG='Lỗi Google: '+e.message; render(); } }
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} AUTH=null; STATE='signin'; render(); }

async function loadAll(){
  render();
  try{ const {data}=await sb.rpc('admin_stats'); DATA.stats=(data&&data[0])||null; }catch(e){}
  try{
    const {data}=await sb.from('payments').select('*').eq('status','pending').order('created_at',{ascending:true});
    const pend=data||[]; const ids=[...new Set(pend.map(p=>p.user_id).filter(Boolean))]; let emails={};
    if(ids.length){ try{ const {data:profs}=await sb.from('profiles').select('id,email').in('id',ids); (profs||[]).forEach(p=>emails[p.id]=p.email); }catch(e){} }
    pend.forEach(p=>p.email=emails[p.user_id]||p.user_id);
    DATA.pending=pend;
  }catch(e){ DATA.pending=[]; }
  try{ const {data}=await sb.from('vouchers').select('*').order('created_at',{ascending:false}); DATA.vouchers=data||[]; }catch(e){ DATA.vouchers=[]; }
  try{ const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(80); DATA.users=data||[]; }catch(e){ DATA.users=[]; }
  render();
}
async function approvePay(id,uid){ try{ const until=new Date(); until.setFullYear(until.getFullYear()+1); await sb.from('profiles').update({premium_until:until.toISOString()}).eq('id',uid); await sb.from('payments').update({status:'approved',approved_by:AUTH.id,approved_at:new Date().toISOString()}).eq('id',id); loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
async function rejectPay(id){ try{ await sb.from('payments').update({status:'rejected'}).eq('id',id); loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
async function createVoucher(){
  const code=($('vf_code').value||'').trim().toUpperCase(); const discount=parseInt($('vf_discount').value||'0',10); const maxRaw=($('vf_max').value||'').trim();
  if(!code||!discount){ alert('Nhập mã và số tiền giảm'); return; }
  try{ await sb.from('vouchers').insert({code,discount_amount:discount,max_uses:maxRaw?parseInt(maxRaw,10):null}); loadAll(); }catch(e){ alert('Lỗi: '+e.message); }
}
async function toggleVoucher(id,active){ try{ await sb.from('vouchers').update({active:!active}).eq('id',id); loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
function nav(v){ UI.view=v; render(); window.scrollTo(0,0); }

/* ===== GATE SCREENS ===== */
function renderGate(){
  return `<div style="min-height:100vh;max-width:480px;margin:0 auto;position:relative;background:#F5F8FA;box-shadow:0 0 40px rgba(15,25,35,.08)">
    <div style="background:linear-gradient(150deg,#0F1923,#123A34 60%,#0A8C77 130%);padding:calc(env(safe-area-inset-top) + 60px) 26px 46px;text-align:center;color:#fff">
      <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">${LOGOW}</div>
      <h1 style="margin:0;font-family:'Space Grotesk';font-size:21px;font-weight:700">EQ GYM <span style="color:#0FB89B">Quản trị</span></h1>
      <p style="color:#B9C6D4;font-size:12.5px;margin:8px 0 0;font-weight:600">Dùng đúng tài khoản đã được cấp quyền admin</p>
    </div>
    <div style="padding:26px 20px">
      <input id="authemail" type="email" placeholder="Email của bạn" style="width:100%;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:13px;padding:14px;font-size:14px">
      <button onclick="signInEmail()" style="width:100%;margin-top:12px;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff;min-height:48px">Gửi liên kết đăng nhập ✉️</button>
      <button onclick="signInGoogle()" style="width:100%;margin-top:10px;border:1px solid #E3E8EE;border-radius:14px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:#0F1923;min-height:46px">Đăng nhập với Google</button>
      ${MSG?`<p style="font-size:12px;color:#5C6B7A;margin:12px 0 0;font-weight:600;text-align:center">${esc(MSG)}</p>`:''}
      <p style="text-align:center;margin:22px 0 0"><a href="../" style="color:#5C6B7A;font-size:12px;font-weight:700">← Về app học</a></p>
    </div>
  </div>`;
}
function renderForbidden(){
  return `<div style="min-height:100vh;max-width:480px;margin:0 auto;position:relative;background:#F5F8FA;box-shadow:0 0 40px rgba(15,25,35,.08);padding:calc(env(safe-area-inset-top) + 60px) 24px;text-align:center">
    <div style="font-size:36px">🔒</div>
    <h1 style="margin:14px 0 0;font-family:'Space Grotesk';font-size:19px;font-weight:700">Không có quyền truy cập</h1>
    <p style="color:#5C6B7A;font-size:13px;margin:10px 0 0;line-height:1.6;font-weight:600">Tài khoản <b style="color:#0F1923">${esc(AUTH.email)}</b> chưa được cấp quyền quản trị.</p>
    <button onclick="signOut()" style="width:100%;margin-top:20px;border:1px solid #E3E8EE;border-radius:14px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:#0F1923;min-height:46px">Đăng xuất</button>
    <p style="margin-top:14px"><a href="../" style="color:#5C6B7A;font-size:12px;font-weight:700">← Về app học</a></p>
  </div>`;
}

/* ===== HEADER + BOTTOM NAV (khung giống app học) ===== */
function header(title,sub){
  return `<div style="display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top) + 18px) 18px 4px">
    ${LOGO}
    <div style="flex:1;min-width:0"><h1 style="margin:0;font-family:'Space Grotesk';font-size:18px;font-weight:700;letter-spacing:-.2px">${title}</h1>${sub?`<p style="margin:1px 0 0;color:#5C6B7A;font-size:11px;font-weight:700">${sub}</p>`:''}</div>
    <a href="../" style="width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E3E8EE;color:#0F1923;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center" title="Về app học">⌂</a>
    <button onclick="signOut()" style="width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E3E8EE;color:#0F1923;font-size:16px;cursor:pointer" title="Đăng xuất">🚪</button>
  </div>`;
}
function bottomNav(){
  const items=[['overview','◧','Tổng quan'],['pending','✓','Duyệt'],['vouchers','🏷️','Voucher'],['users','👥','Học viên']];
  let h=`<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid #E3E8EE;display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:40">`;
  items.forEach(it=>{ const active=UI.view===it[0];
    h+=`<button onclick="nav('${it[0]}')" style="flex:1;text-align:center;background:none;border:none;color:${active?'#0A6E5D':'#5C6B7A'};font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;padding:6px 0;min-height:52px">
      <span style="font-size:18px;line-height:1">${it[1]}</span>${it[2]}${(it[0]==='pending'&&DATA.pending&&DATA.pending.length)?`<span style="position:absolute;margin:-20px 0 0 22px;background:#E85B5B;color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px">${DATA.pending.length}</span>`:''}
    </button>`;
  });
  return h+`</div>`;
}
function card(inner,style){ return `<div style="background:#fff;border:1px solid #E3E8EE;border-radius:16px;padding:14px;margin-bottom:12px;${style||''}">${inner}</div>`; }
function pill(text,kind){ const c={good:'background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff',off:'background:#E3E8EE;color:#5C6B7A',warn:'background:#FDECEC;color:#C74848'}[kind||'off']; return `<span style="display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;${c}">${text}</span>`; }

/* ===== VIEWS ===== */
function viewOverview(){
  const st=DATA.stats;
  let h=header('Tổng quan','Số liệu toàn hệ thống');
  h+=`<div style="padding:14px 16px 90px">`;
  h+=`<div style="background:linear-gradient(150deg,#0F1923,#123A34 60%,#0A8C77 130%);border-radius:20px;padding:18px;color:#fff;box-shadow:0 14px 34px rgba(15,25,35,.22);margin-bottom:14px">
    <div style="font-family:'Space Grotesk';font-weight:700;letter-spacing:2px;font-size:10.5px;color:#0FB89B">DOANH THU ĐÃ DUYỆT</div>
    <div style="font-family:'Space Grotesk';font-size:30px;font-weight:800;margin-top:4px">${st?fmt(st.revenue)+'đ':'—'}</div>
  </div>`;
  if(st){
    h+=`<div style="display:flex;gap:10px;margin-bottom:6px">
      ${card(`<div style="font-size:22px;font-weight:800;font-family:'Space Grotesk'">${fmt(st.total_users)}</div><div style="font-size:10.5px;color:#5C6B7A;font-weight:700;margin-top:2px">Học viên</div>`,'flex:1;text-align:center;margin-bottom:0')}
      ${card(`<div style="font-size:22px;font-weight:800;font-family:'Space Grotesk';color:#0A8C77">${fmt(st.premium_users)}</div><div style="font-size:10.5px;color:#5C6B7A;font-weight:700;margin-top:2px">Premium</div>`,'flex:1;text-align:center;margin-bottom:0')}
      ${card(`<div style="font-size:22px;font-weight:800;font-family:'Space Grotesk';color:${st.pending_payments>0?'#E85B5B':'#0F1923'}">${fmt(st.pending_payments)}</div><div style="font-size:10.5px;color:#5C6B7A;font-weight:700;margin-top:2px">Chờ duyệt</div>`,'flex:1;text-align:center;margin-bottom:0')}
    </div>`;
  } else h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải thống kê...</p>`;
  h+=`</div>`;
  return h;
}
function viewPending(){
  let h=header('Chờ duyệt','Yêu cầu nâng cấp Premium');
  h+=`<div style="padding:14px 16px 90px">`;
  if(DATA.pending==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.pending.length) h+=`<div style="text-align:center;color:#5C6B7A;padding:50px 20px;font-weight:600"><div style="font-size:34px">✅</div><p>Không có yêu cầu chờ duyệt.</p></div>`;
  else DATA.pending.forEach(p=>{
    h+=card(`<h4 style="margin:0 0 6px;font-size:13.5px;font-weight:800">💳 ${esc(p.email)}</h4>
      <div style="font-size:11px;color:#5C6B7A;font-weight:700">Mã CK: ${esc(p.code||'—')} · ${new Date(p.created_at).toLocaleString('vi-VN')}</div>
      <p style="margin:6px 0;font-size:13.5px">Số tiền: <b>${fmt(p.amount||0)}đ</b></p>
      ${p.voucher_code?`<div style="margin-bottom:8px">${pill(esc(p.voucher_code)+' · -'+fmt(p.discount_amount||0)+'đ','good')}</div>`:''}
      <button onclick="approvePay('${p.id}','${p.user_id}')" style="width:100%;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff;min-height:44px">Duyệt · +1 năm Premium</button>
      <button onclick="rejectPay('${p.id}')" style="width:100%;margin-top:8px;border:1px solid #E3E8EE;border-radius:12px;padding:11px;font-weight:800;cursor:pointer;background:#fff;color:#5C6B7A;min-height:42px">Từ chối</button>`);
  });
  h+=`</div>`;
  return h;
}
function viewVouchers(){
  let h=header('Mã giảm giá','Tạo & quản lý voucher');
  h+=`<div style="padding:14px 16px 90px">`;
  h+=card(`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="vf_code" placeholder="MÃ (vd EQGYM199K)" style="flex:1;min-width:120px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:11px;padding:11px;font-size:13px;text-transform:uppercase">
      <input id="vf_discount" type="number" placeholder="Giảm (đ)" style="width:100px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:11px;padding:11px;font-size:13px">
      <input id="vf_max" type="number" placeholder="Lượt (trống=∞)" style="width:120px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:11px;padding:11px;font-size:13px">
    </div>
    <button onclick="createVoucher()" style="width:100%;margin-top:10px;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;min-height:44px">+ Tạo mã mới</button>`);
  if(DATA.vouchers==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.vouchers.length) h+=`<p style="color:#5C6B7A;font-weight:600">Chưa có mã nào.</p>`;
  else DATA.vouchers.forEach(v=>{
    h+=card(`<div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0"><b style="font-family:'Space Grotesk';font-size:14px">${esc(v.code)}</b> ${pill(v.active?'Đang bật':'Đã tắt',v.active?'good':'off')}
      <div style="font-size:11.5px;color:#5C6B7A;font-weight:600;margin-top:3px">Giảm ${fmt(v.discount_amount)}đ · Đã dùng ${v.used_count}${v.max_uses!=null?'/'+v.max_uses:''}</div></div>
      <button onclick="toggleVoucher('${v.id}',${v.active})" style="border:1px solid #E3E8EE;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#5C6B7A;min-height:38px">${v.active?'Tắt':'Bật'}</button>
    </div>`,'padding:12px 14px');
  });
  h+=`</div>`;
  return h;
}
function viewUsers(){
  let h=header('Học viên',DATA.users?DATA.users.length+' gần đây':'');
  h+=`<div style="padding:14px 16px 90px">`;
  if(DATA.users==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.users.length) h+=`<p style="color:#5C6B7A;font-weight:600">Chưa có học viên.</p>`;
  else{
    h+=`<div style="background:#fff;border:1px solid #E3E8EE;border-radius:16px;overflow:hidden">`;
    DATA.users.forEach((u,i)=>{ const prem=u.premium_until&&new Date(u.premium_until)>new Date();
      h+=`<div style="padding:12px 14px;display:flex;align-items:center;gap:10px;${i?'border-top:1px solid #E3E8EE':''}">
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.email||u.id)}</div><div style="font-size:10.5px;color:#5C6B7A;font-weight:600">${new Date(u.created_at).toLocaleDateString('vi-VN')}${u.role==='admin'?' · Admin':''}</div></div>
        ${pill(prem?'★ Premium':'Free',prem?'good':'off')}
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderDashboard(){
  let main='';
  if(UI.view==='overview') main=viewOverview();
  else if(UI.view==='pending') main=viewPending();
  else if(UI.view==='vouchers') main=viewVouchers();
  else if(UI.view==='users') main=viewUsers();
  return `<div style="min-height:100vh;max-width:480px;margin:0 auto;position:relative;background:#F5F8FA;box-shadow:0 0 40px rgba(15,25,35,.08)">${main}</div>${bottomNav()}`;
}

function render(){
  const app=$('app');
  if(STATE==='loading') app.innerHTML=`<div style="min-height:100vh;max-width:480px;margin:0 auto;background:#F5F8FA"></div>`;
  else if(STATE==='signin') app.innerHTML=renderGate();
  else if(STATE==='forbidden') app.innerHTML=renderForbidden();
  else app.innerHTML=renderDashboard();
}
