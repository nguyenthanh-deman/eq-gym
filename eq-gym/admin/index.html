function cleanAuthParams(){
  try{
    const url=new URL(location.href);
    ['code','state','access_token','refresh_token','expires_in','expires_at','token_type','type','provider_token','provider_refresh_token','error','error_code','error_description'].forEach(k=>url.searchParams.delete(k));
    url.hash='';
    if(url.href!==location.href) history.replaceState(null,'',url.pathname+url.search);
  }catch(e){}
}

async function boot(){
  try{ const qp=new URLSearchParams(location.search); const oe=qp.get('error'); if(oe) MSG='Đăng nhập lỗi: '+(qp.get('error_description')||oe).replace(/\+/g,' '); }catch(e){}
  const {data}=await sb.auth.getSession();
  await applySession(data.session);
  cleanAuthParams();
  sb.auth.onAuthStateChange((_e,session)=>{ applySession(session); });
}
async function applySession(session){
  if(session&&session.user){
    const u=session.user; let prof=null;
    try{ const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){}
    if(!prof){ try{ await sb.from('profiles').upsert({id:u.id,email:u.email}); const {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); prof=data; }catch(e){} }
    AUTH={id:u.id,email:u.email,role:prof&&prof.role};
    STATE=(AUTH.role==='admin'||AUTH.role==='super_admin')?'ready':'forbidden';
    if(STATE==='ready') loadAll();
  } else { AUTH=null; STATE='signin'; }
  render();
}
async function signInEmail(){
  const email=($('authemail')&&$('authemail').value||'').trim();
  if(!email||!/.+@.+\..+/.test(email)){ MSG='Nhập email hợp lệ'; render(); return; }
  try{ const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}}); if(error) throw error; MSG='Đã gửi liên kết đăng nhập — mở email và bấm vào link.'; }
  catch(e){ MSG='Lỗi: '+e.message; }
  render();
}
async function signInGoogle(){ try{ await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}); }catch(e){ MSG='Lỗi Google: '+e.message; render(); } }
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} AUTH=null; STATE='signin'; render(); }

async function loadAll(){
  render();
  try{ const {data}=await sb.rpc('admin_stats'); DATA.stats=(data&&data[0])||null; }catch(e){}
  try{
    const {data}=await sb.from('payments').select('*').eq('status','pending').order('created_at',{ascending:true});
    let pend=data||[];
    // Đơn QR PayOS bỏ dở quá hạn → đóng luôn cho khỏi treo ở "Chờ duyệt" (webhook không bao giờ tới nữa)
    const stale=pend.filter(p=>p.provider==='payos'&&p.expires_at&&new Date(p.expires_at).getTime()<Date.now()-5*60000);
    if(stale.length){ await Promise.all(stale.map(p=>sb.rpc('admin_set_payment_status',{p_id:p.id,p_status:'expired'}).catch(()=>{}))); pend=pend.filter(p=>!stale.includes(p)); }
    const ids=[...new Set(pend.map(p=>p.user_id).filter(Boolean))]; let emails={};
    if(ids.length){ try{ const {data:profs}=await sb.from('profiles').select('id,email').in('id',ids); (profs||[]).forEach(p=>emails[p.id]=p.email); }catch(e){} }
    pend.forEach(p=>p.email=emails[p.user_id]||p.user_id);
    DATA.pending=pend;
  }catch(e){ DATA.pending=[]; }
  render();
  try{ const {data}=await sb.from('vouchers').select('*').order('created_at',{ascending:false}); DATA.vouchers=data||[]; }catch(e){ DATA.vouchers=[]; }
  render();
  await loadUsers();
  await loadSettings();
  if(UI.view==='affiliate') loadAffiliate();
}
async function loadSettings(){ try{ const {data}=await sb.from('settings').select('key,value'); const s={}; (data||[]).forEach(r=>s[r.key]=r.value); DATA.settings=s; }catch(e){ DATA.settings={}; } render(); }

/* ===== Users: phân trang + tìm kiếm + sắp xếp phía server (danh sách có thể rất dài) ===== */
const USER_SORTS={
  created_desc:{col:'created_at',asc:false,label:'Mới nhất'},
  created_asc:{col:'created_at',asc:true,label:'Cũ nhất'},
  email_asc:{col:'email',asc:true,label:'Email A-Z'},
  email_desc:{col:'email',asc:false,label:'Email Z-A'}
};
async function loadUsers(){
  const wasFocused=document.activeElement&&document.activeElement.id==='usersSearch';
  const sd=USER_SORTS[UI.usersSort]||USER_SORTS.created_desc;
  let q=sb.from('profiles').select('*',{count:'exact'});
  if(UI.usersSearch.trim()) q=q.ilike('email','%'+UI.usersSearch.trim()+'%');
  q=q.order(sd.col,{ascending:sd.asc});
  const from=UI.usersPage*PAGE_SIZE;
  q=q.range(from,from+PAGE_SIZE-1);
  try{ const {data,count}=await q; DATA.users=data||[]; DATA.usersTotal=count||0; }catch(e){ DATA.users=[]; DATA.usersTotal=0; }
  render();
  if(wasFocused) refocus('usersSearch');
}
function refocus(id){ const el=$(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
function renderKeepFocus(id){ render(); refocus(id); }
let _usersSearchT=null;
function onUsersSearch(v){ UI.usersSearch=v; UI.usersPage=0; clearTimeout(_usersSearchT); _usersSearchT=setTimeout(loadUsers,350); }
function onUsersSort(v){ UI.usersSort=v; UI.usersPage=0; loadUsers(); }
function usersPageGo(d){ const maxPage=Math.max(0,Math.ceil(DATA.usersTotal/PAGE_SIZE)-1); UI.usersPage=Math.min(maxPage,Math.max(0,UI.usersPage+d)); loadUsers(); }

function applySort(arr,col,asc){ return [...arr].sort((a,b)=>{ let x=a[col],y=b[col]; if(typeof x==='string') x=x.toLowerCase(); if(typeof y==='string') y=y.toLowerCase(); if(x==null) x=asc?-Infinity:Infinity; if(y==null) y=asc?-Infinity:Infinity; if(x<y) return asc?-1:1; if(x>y) return asc?1:-1; return 0; }); }
function paginate(arr,page,pageSize){ const from=page*pageSize; return arr.slice(from,from+pageSize); }
function onPendingSearch(v){ UI.pendingSearch=v; UI.pendingPage=0; renderKeepFocus('pendingSearch'); }
function onPendingSort(v){ UI.pendingSort=v; UI.pendingPage=0; render(); }
function pendingPageGo(d){ UI.pendingPage=Math.max(0,UI.pendingPage+d); render(); }

async function createVoucher(){
  const code=($('vf_code').value||'').trim().toUpperCase(); const discount=parseInt($('vf_discount').value||'0',10); const maxRaw=($('vf_max').value||'').trim();
  if(!code||!discount){ alert('Nhập mã và số tiền giảm'); return; }
  try{ await sb.from('vouchers').insert({code,discount_amount:discount,max_uses:maxRaw?parseInt(maxRaw,10):null}); loadAll(); }catch(e){ alert('Lỗi: '+e.message); }
}
async function toggleVoucher(id,active){ try{ await sb.from('vouchers').update({active:!active}).eq('id',id); loadAll(); }catch(e){ alert('Lỗi: '+e.message); } }
function editVoucherStart(id){ UI.editVoucherId=id; render(); }
function editVoucherCancel(){ UI.editVoucherId=null; render(); }
async function saveVoucher(id){
  const code=($('ev_code_'+id).value||'').trim().toUpperCase();
  const discount=parseInt($('ev_discount_'+id).value||'0',10);
  const maxRaw=($('ev_max_'+id).value||'').trim();

  catch(e){ alert('Lỗi: '+e.message); }
}

async function changeRole(uid,role){ try{ const {error}=await sb.rpc('admin_set_role',{p_user_id:uid,p_role:role}); if(error) throw error; loadUsers(); }catch(e){ alert('Lỗi: '+e.message); loadUsers(); } }

async function setCommission(id,status){
  const msg={approved:'Duyệt khoản hoa hồng này? (chuyển sang "Chờ chuyển tiền")',paid:'Đánh dấu ĐÃ CHUYỂN TIỀN cho khoản này?',void:'Huỷ khoản hoa hồng này? (gian lận / đơn hoàn tiền)',pending:'Khôi phục về "Chờ duyệt"?'}[status];

  try{ const {error}=await sb.rpc('admin_set_commission_status',{p_id:id,p_status:status}); if(error) throw error; loadAffiliate(); }catch(e){ alert('Lỗi: '+e.message); }
}
async function saveAffSettings(){
  const rate=parseFloat(($('as_rate').value||'0').replace(',','.'))/100, disc=parseInt($('as_disc').value||'0',10), hold=parseInt($('as_hold').value||'0',10);
  if(isNaN(rate)||rate<0||rate>1){ alert('% hoa hồng phải từ 0 đến 100'); return; }
  const now=new Date().toISOString();
  const rows=[{key:'affiliate_enabled',value:$('as_enabled').checked},{key:'affiliate_rate',value:rate},{key:'affiliate_referee_discount',value:disc||0},{key:'affiliate_hold_days',value:hold||0}].map(r=>({...r,updated_at:now}));
  UI.affBusy=true; render();
  try{ const {error}=await sb.from('settings').upsert(rows); if(error) throw error; await loadSettings(); alert('Đã lưu cấu hình affiliate'); }catch(e){ alert('Lỗi: '+e.message); }
  UI.affBusy=false; render();
}
/* Xuất danh sách "Chờ chuyển tiền" gộp theo người nhận → chị chuyển khoản theo file này rồi bấm "Đã trả" từng khoản */
async function exportAffCsv(){
  try{
    const {data,error}=await sb.from('affiliate_commissions_admin').select('*').eq('status','approved').order('referrer_email').limit(2000);
    if(error) throw error; if(!data||!data.length){ alert('Không có khoản nào đang chờ chuyển tiền.'); return; }
    const by={}; data.forEach(c=>{ const k=c.referrer_id; by[k]=by[k]||{email:c.referrer_email,payout:c.referrer_payout||{},n:0,sum:0}; by[k].n++; by[k].sum+=c.commission||0; });
    const rows=[['Email','Ngân hàng','Số tài khoản','Chủ tài khoản','Số khoản','Tổng hoa hồng (đ)']];
    Object.values(by).forEach(r=>rows.push([r.email||'',r.payout.bank||'',r.payout.account||'',r.payout.name||'',r.n,r.sum]));
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='eqgym-hoa-hong-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('Lỗi xuất file: '+e.message); }
}

/* ===== HEADER + BOTTOM NAV (khung giống app học) ===== */
function header(title,sub){
  return `<div style="display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top) + 18px) 18px 4px">
    ${LOGO}
    <div style="flex:1;min-width:0"><h1 style="margin:0;font-family:'Space Grotesk';font-size:18px;font-weight:700;letter-spacing:-.2px">${title}</h1>${sub?`<p style="margin:1px 0 0;color:#5C6B7A;font-size:11px;font-weight:700">${sub}</p>`:''}</div>
    <a href="../" style="width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E3E8EE;color:#0F1923;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center" title="Về app học">⌂</a>
    <button onclick="signOut()" style="width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E3E8EE;color:#0F1923;font-size:16px;cursor:pointer" title="Đăng xuất">🚪</button>
  </div>`;
}
function bottomNav(){
  const items=[['overview','◧','Tổng quan'],['pending','✓','Duyệt'],['vouchers','🏷️','Voucher'],['affiliate','🤝','Affiliate'],['users','👥','Học viên']];
  let h=`<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid #E3E8EE;display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:40">`;
  items.forEach(it=>{ const active=UI.view===it[0];
    h+=`<button onclick="nav('${it[0]}')" style="flex:1;text-align:center;background:none;border:none;color:${active?'#0A6E5D':'#5C6B7A'};font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;padding:6px 0;min-height:52px">
      <span style="font-size:18px;line-height:1">${it[1]}</span>${it[2]}${(it[0]==='pending'&&DATA.pending&&DATA.pending.length)?`<span style="position:absolute;margin:-20px 0 0 22px;background:#E85B5B;color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px">${DATA.pending.length}</span>`:''}
    </button>`;
  });
  return h+`</div>`;
}
function card(inner,style){ return `<div style="background:#fff;border:1px solid #E3E8EE;border-radius:16px;padding:14px;margin-bottom:12px;${style||''}">${inner}</div>`; }
function pill(text,kind){ const c={good:'background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff',off:'background:#E3E8EE;color:#5C6B7A',warn:'background:#FDECEC;color:#C74848'}[kind||'off']; return `<span style="display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;${c}">${text}</span>`; }
function searchSortBar(inputId,placeholder,searchVal,onSearchFn,sortId,sortOptions,sortVal,onSortFn){
  return `<div style="display:flex;gap:8px;margin-bottom:12px">
    <input id="${inputId}" value="${esc(searchVal)}" oninput="${onSearchFn}(this.value)" placeholder="${placeholder}" style="flex:1;min-width:0;background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:11px 13px;font-size:13px">
    <select id="${sortId}" onchange="${onSortFn}(this.value)" style="background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:0 8px;font-size:12px;font-weight:700;color:#0F1923;flex:0 0 auto">
      ${sortOptions.map(o=>`<option value="${o.value}" ${o.value===sortVal?'selected':''}>${o.label}</option>`).join('')}
    </select>
  </div>`;
}
function pager(page,total,pageSize,onPrev,onNext){
  if(total<=pageSize) return '';
  const maxPage=Math.max(0,Math.ceil(total/pageSize)-1);
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 2px 2px">
    <button onclick="${onPrev}" ${page<=0?'disabled':''} style="border:1px solid #E3E8EE;background:#fff;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;opacity:${page<=0?.4:1}">‹ Trước</button>
    <span style="font-size:11.5px;color:#5C6B7A;font-weight:700">Trang ${page+1}/${maxPage+1} · ${fmt(total)} mục</span>
    <button onclick="${onNext}" ${page>=maxPage?'disabled':''} style="border:1px solid #E3E8EE;background:#fff;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;opacity:${page>=maxPage?.4:1}">Sau ›</button>
  </div>`;
}

  if(UI.payTab==='history'){ h+=viewHistoryList(); h+=`</div>`; return h; }

  h+=searchSortBar('pendingSearch','Tìm theo email hoặc mã CK...',UI.pendingSearch,'onPendingSearch','pendingSortSel',Object.entries(PENDING_SORTS).map(([v,d])=>({value:v,label:d.label})),UI.pendingSort,'onPendingSort');

  });

        <div style="flex:1;min-width:0"><b style="font-family:'Space Grotesk';font-size:14px">${esc(v.code)}</b> ${pill(v.active?'Đang bật':'Đã tắt',v.active?'good':'off')}
        <div style="font-size:11.5px;color:#5C6B7A;font-weight:600;margin-top:3px">Giảm ${fmt(v.discount_amount)}đ · Đã dùng ${v.used_count}${v.max_uses!=null?'/'+v.max_uses:''}</div></div>
        <button onclick="editVoucherStart('${v.id}')" style="border:1px solid #E3E8EE;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#5C6B7A;min-height:38px">Sửa</button>
        <button onclick="toggleVoucher('${v.id}',${v.active})" style="border:1px solid #E3E8EE;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:#5C6B7A;min-height:38px">${v.active?'Tắt':'Bật'}</button>
      </div>`,'padding:12px 14px');
    }
  });
  h+=pager(UI.vouchersPage,total,PAGE_SIZE,'vouchersPageGo(-1)','vouchersPageGo(1)');
  h+=`</div>`;
  return h;
}
function viewUsers(){
  let h=header('Học viên',DATA.usersTotal?fmt(DATA.usersTotal)+' tổng':'');
  h+=`<div style="padding:14px 16px 90px">`;
  h+=searchSortBar('usersSearch','Tìm theo email...',UI.usersSearch,'onUsersSearch','usersSortSel',Object.entries(USER_SORTS).map(([v,d])=>({value:v,label:d.label})),UI.usersSort,'onUsersSort');
  const isSuper=AUTH.role==='super_admin';
  if(DATA.users==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.users.length) h+=`<p style="color:#5C6B7A;font-weight:600;text-align:center;padding:20px 0">Không tìm thấy học viên nào.</p>`;
  else{
    DATA.users.forEach(u=>{
      const prem=u.premium_until&&new Date(u.premium_until)>new Date();
      const roleLabel=u.role==='super_admin'?' · Super Admin':u.role==='admin'?' · Admin':'';
      const isSelf=u.id===AUTH.id;
      h+=card(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:${isSuper&&!isSelf?'10px':'0'}">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.email||u.id)}${isSelf?' (bạn)':''}</div>
          <div style="font-size:10.5px;color:#5C6B7A;font-weight:600">${new Date(u.created_at).toLocaleDateString('vi-VN')}${roleLabel}</div>
        </div>
        ${u.banned?pill('Đã khoá','warn'):pill(prem?'★ Premium':'Free',prem?'good':'off')}
      </div>
      ${isSuper&&!isSelf?`<div style="display:flex;gap:6px;flex-wrap:wrap">
        <select onchange="changeRole('${u.id}',this.value)" style="flex:1;min-width:112px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:9px;padding:8px;font-size:11.5px;font-weight:700">
          <option value="user" ${u.role==='user'||!u.role?'selected':''}>Học viên</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
          <option value="super_admin" ${u.role==='super_admin'?'selected':''}>Super Admin</option>
        </select>
        <button onclick="grantPremium('${u.id}')" style="border:1px solid #E3E8EE;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer;background:#fff;color:#0A6E5D">+ Premium</button>
        ${prem?`<button onclick="revokePremium('${u.id}')" style="border:1px solid #E3E8EE;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer;background:#fff;color:#C74848">Xoá Premium</button>`:''}
        <button onclick="banUser('${u.id}',${!!u.banned})" style="border:1px solid #E3E8EE;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer;background:#fff;color:${u.banned?'#0A6E5D':'#C74848'}">${u.banned?'Mở khoá':'Khoá'}</button>
      </div>`:''}`,'padding:12px 14px');
    });
    h+=pager(UI.usersPage,DATA.usersTotal,PAGE_SIZE,'usersPageGo(-1)','usersPageGo(1)');
  }
  h+=`</div>`;
  return h;
}

function viewAffiliate(){
  const s=DATA.settings||{}, st=DATA.affStats;
  let h=header('Affiliate','Mã giới thiệu & hoa hồng');
  h+=`<div style="padding:14px 16px 90px">`;
  if(st) h+=`<div style="display:flex;gap:8px;margin-bottom:12px">
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#E0930A">${fmt(st.pending_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Chờ duyệt</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#C74848">${fmt(st.approved_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Chờ chuyển</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
      ${card(`<div style="font-size:17px;font-weight:800;font-family:'Space Grotesk';color:#0A8C77">${fmt(st.paid_sum)}đ</div><div style="font-size:10px;color:#5C6B7A;font-weight:700;margin-top:2px">Đã trả</div>`,'flex:1;text-align:center;margin-bottom:0;padding:10px 6px')}
    </div><div style="font-size:11.5px;color:#5C6B7A;font-weight:700;margin:-4px 2px 12px">${fmt(st.referrers)} người đã có hoa hồng · ${fmt(st.referred_users)} học viên vào qua giới thiệu</div>`;
  const inp='background:#F5F8FA;border:1px solid #E3E8EE;border-radius:11px;padding:10px;font-size:13px;width:100%';
  const rate=s.affiliate_rate!=null?Math.round(+s.affiliate_rate*1000)/10:20, disc=s.affiliate_referee_discount!=null?+s.affiliate_referee_discount:50000, hold=s.affiliate_hold_days!=null?+s.affiliate_hold_days:7, on=s.affiliate_enabled!==false;
  h+=card(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:13.5px">⚙️ Cấu hình chương trình</b><label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:${on?'#0A6E5D':'#5C6B7A'}"><input type="checkbox" id="as_enabled" ${on?'checked':''} style="width:18px;height:18px;accent-color:#0FB89B">Đang bật</label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <label style="font-size:10.5px;color:#5C6B7A;font-weight:700">% hoa hồng<input id="as_rate" type="number" step="0.5" min="0" max="100" value="${rate}" style="${inp};margin-top:4px"></label>
      <label style="font-size:10.5px;color:#5C6B7A;font-weight:700">Giảm người mới (đ)<input id="as_disc" type="number" min="0" step="1000" value="${disc}" style="${inp};margin-top:4px"></label>
      <label style="font-size:10.5px;color:#5C6B7A;font-weight:700">Giữ (ngày)<input id="as_hold" type="number" min="0" value="${hold}" style="${inp};margin-top:4px"></label>
    </div>
    <p style="margin:8px 0 0;font-size:11px;color:#8A97A5;font-weight:600;line-height:1.5">Mỗi học viên có sẵn mã giới thiệu 6 ký tự. Người mới nhập mã khi nâng cấp lần đầu được giảm; người giới thiệu nhận % trên số tiền thực trả. "Giữ" = số ngày sau thanh toán mới nên duyệt (phòng hoàn tiền).</p>
    <button onclick="saveAffSettings()" ${UI.affBusy?'disabled':''} style="width:100%;margin-top:10px;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;min-height:44px;opacity:${UI.affBusy?.6:1}">${UI.affBusy?'Đang lưu...':'Lưu cấu hình'}</button>`);
  h+=`<div style="display:flex;gap:5px;margin-bottom:10px;overflow-x:auto">${Object.entries(AFF_STATUS).map(([v,l])=>`<button onclick="setAffStatus('${v}')" style="flex:1;white-space:nowrap;border:1px solid ${UI.affStatus===v?'#0FB89B':'#E3E8EE'};border-radius:10px;padding:8px 9px;font-size:11px;font-weight:800;cursor:pointer;background:${UI.affStatus===v?'#EAFBF6':'#fff'};color:${UI.affStatus===v?'#0A6E5D':'#5C6B7A'}">${l}</button>`).join('')}</div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="affSearch" value="${esc(UI.affSearch)}" oninput="onAffSearch(this.value)" placeholder="Tìm theo email người giới thiệu..." style="flex:1;min-width:0;background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:11px 13px;font-size:13px">
    ${UI.affStatus==='approved'?`<button onclick="exportAffCsv()" style="border:none;border-radius:12px;padding:0 12px;font-size:12px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;white-space:nowrap">⬇ CSV chuyển tiền</button>`:''}</div>`;
  if(DATA.aff==null) h+=`<p style="color:#5C6B7A;font-weight:600">Đang tải...</p>`;
  else if(!DATA.aff.length) h+=`<p style="color:#5C6B7A;font-weight:600;text-align:center;padding:20px 0">Chưa có khoản hoa hồng nào${UI.affStatus!=='all'?' ở trạng thái này':''}.</p>`;
  else DATA.aff.forEach(c=>{
    const po=c.referrer_payout||{}; const ready=!c.available_at||new Date(c.available_at)<=new Date();
    const sp=c.status==='paid'?pill('Đã trả','good'):c.status==='approved'?pill('Chờ chuyển','warn'):c.status==='void'?pill('Đã huỷ','off'):pill(ready?'Có thể duyệt':'Đang giữ','off');
    const btn=(t,fn,dark)=>`<button onclick="${fn}" style="flex:1;border:${dark?'none':'1px solid #E3E8EE'};border-radius:10px;padding:9px 8px;font-size:11.5px;font-weight:800;cursor:pointer;background:${dark?'#0F1923':'#fff'};color:${dark?'#fff':'#5C6B7A'};min-height:38px">${t}</button>`;
    let acts='';
    if(c.status==='pending') acts=btn(ready?'Duyệt':'Duyệt sớm',`setCommission('${c.id}','approved')`,true)+btn('Huỷ',`setCommission('${c.id}','void')`);
    else if(c.status==='approved') acts=btn('✓ Đã chuyển tiền',`setCommission('${c.id}','paid')`,true)+btn('Huỷ',`setCommission('${c.id}','void')`);
    else if(c.status==='void') acts=btn('Khôi phục',`setCommission('${c.id}','pending')`);
    h+=card(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.referrer_email||c.referrer_id)}</div>
        <div style="font-size:10.5px;color:#5C6B7A;font-weight:600;margin-top:2px">giới thiệu ${esc(c.referee_email||'—')} · ${new Date(c.created_at).toLocaleDateString('vi-VN')}</div></div>${sp}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><span style="font-size:11.5px;color:#5C6B7A;font-weight:700">${Math.round(+c.rate*100)}% × ${fmt(c.amount_paid)}đ</span><b style="font-family:'Space Grotesk';font-size:17px;color:#E0930A">${fmt(c.commission)}đ</b></div>
      ${c.status==='pending'&&!ready?`<div style="font-size:10.5px;color:#8A97A5;font-weight:600;margin-top:2px">Nên duyệt từ ${new Date(c.available_at).toLocaleDateString('vi-VN')}</div>`:''}
      ${c.status==='approved'?`<div style="margin-top:6px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:10px;padding:8px 10px;font-size:11.5px;font-weight:600;line-height:1.5">${po.account?`Chuyển tới: <b>${esc(po.bank||'')}</b> · <b>${esc(po.account)}</b> · ${esc(po.name||'')}`:'<span style="color:#C74848">Người nhận chưa nhập tài khoản ngân hàng</span>'}</div>`:''}
      ${c.paid_at?`<div style="font-size:10.5px;color:#8A97A5;font-weight:600;margin-top:4px">Đã chuyển lúc ${new Date(c.paid_at).toLocaleString('vi-VN')}</div>`:''}
      ${acts?`<div style="display:flex;gap:6px;margin-top:10px">${acts}</div>`:''}`,'padding:12px 14px');
  });
  h+=pager(UI.affPage,DATA.affTotal,PAGE_SIZE,'affPageGo(-1)','affPageGo(1)');
  h+=`</div>`;
  return h;
}

function renderDashboard(){
  let main='';
  if(UI.view==='overview') main=viewOverview();
  else if(UI.view==='pending') main=viewPending();
  else if(UI.view==='vouchers') main=viewVouchers();
  else if(UI.view==='affiliate') main=viewAffiliate();
  else if(UI.view==='users') main=viewUsers();
  return `<div style="min-height:100vh;max-width:480px;margin:0 auto;position:relative;background:#F5F8FA;box-shadow:0 0 40px rgba(15,25,35,.08)">${main}</div>${bottomNav()}`;
}

function render(){
  const app=$('app');
  if(STATE==='loading') app.innerHTML=`<div style="min-height:100vh;max-width:480px;margin:0 auto;background:#F5F8FA"></div>`;
  else if(STATE==='signin') app.innerHTML=renderGate();
  else if(STATE==='forbidden') app.innerHTML=renderForbidden();
  else app.innerHTML=renderDashboard();
}

render();
boot();
</script>
</body>
</html>
