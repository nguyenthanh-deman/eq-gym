<style>
html,body{margin:0;padding:0;background:#E9EDF2}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;color:#0F1923;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:#0A6E5D;text-decoration:none}
textarea,input{font-family:'Nunito',sans-serif}
textarea:focus,input:focus{outline:none;border-color:#0FB89B !important}
button{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,91,91,.35)}50%{box-shadow:0 0 0 10px rgba(232,91,91,0)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.sp{width:16px;height:16px;border:2px solid #B6EDDF;border-top-color:#0A6E5D;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
.pbar{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:6px 0}

.pbar .ptrk{flex:1;height:8px;border-radius:6px;background:#E2E8EE;overflow:hidden}
.pbar .ptrk i{display:block;height:100%;background:linear-gradient(90deg,#0FB89B,#E85B5B);transition:width .5s}
.pbar b{flex:0 0 30px;text-align:right;color:#0A6E5D;font-weight:900;font-family:'Space Grotesk'}
.radar .rlab{fill:#5C6B7A;font-size:11px;font-weight:700;font-family:'Nunito'}

<body>
<div id="app"></div>
<script>
/* ================================================================
   ☁️ CẤU HÌNH BACKEND (SUPABASE) — dán 2 giá trị để bật tài khoản/Premium
   Trống = chế độ local (chạy như thường, mở khóa tất cả). Xem docs/SETUP-SUPABASE.md
   ================================================================ */
const SUPA_URL="";
const SUPA_ANON="";
const BACKEND=!!(SUPA_URL && SUPA_ANON && window.supabase);
let sb=BACKEND ? window.supabase.createClient(SUPA_URL,SUPA_ANON) : null;
let AUTH=null;

/* ================================================================
   🔐 APP BACKEND (Apps Script) — mã đăng nhập + Gemini ẩn + điểm + thi đua
   Dán URL web app (app-backend.gs) vào APP_BACKEND. Trống = chế độ mở (local).
   Xem SETUP-APP-BACKEND.md
   ================================================================ */
const APP_BACKEND="https://script.google.com/macros/s/AKfycbzGE2VvkjQcsSAcpT6GToZVikTBjvxye4Zz80xZvMK8uPcXbVpNwnDiPM7ChGNs3feDmg/exec";
const CODE_MODE=!!APP_BACKEND;
/* 🌐 CHẾ ĐỘ MỞ THỬ (public): true = ai cũng vào được, KHÔNG cần mã đăng nhập.
   Dùng chung 1 mã khách (GUEST_CODE) để Coach AI vẫn chạy. Đổi false để bật lại đăng nhập bằng mã. */
const OPEN_MODE=true;
const GUEST_CODE="EQ4VEEB";
let MEMBER=null; // {code,name,points,role}
function memberCode(){ try{ return localStorage.getItem('eqgym_code')||''; }catch(e){ return ''; } }
async function api(payload){ const r=await fetch(APP_BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return await r.json(); }
function aiReady(){ return (CODE_MODE && MEMBER) || !!getKey(); }
async function geminiFetch(body){
  if(CODE_MODE && MEMBER){ const d=await api({action:'ai',code:MEMBER.code,body}); if(!d||!d.ok||!d.gemini) throw new Error((d&&d.error)||'AI proxy lỗi'); return d.gemini; }
  const key=getKey(); if(!key) throw new Error('no key');
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status); return await r.json();
}
let _psT=null;
function memberSession(){ try{ return localStorage.getItem('eqgym_session')||''; }catch(e){ return ''; } }
function handleKick(d){ if(OPEN_MODE) return false; if(d&&d.ok===false&&(d.error==='session'||d.error==='blocked')){ kickedLogout(d.error); return true; } return false; }
function kickedLogout(reason){ MEMBER=null; try{ localStorage.removeItem('eqgym_code'); localStorage.removeItem('eqgym_session'); }catch(e){} stopHeartbeat(); stopRankRefresh(); UI.settingsOpen=false; UI.view='home'; UI.loginErr=(reason==='blocked')?'Tài khoản của bạn đã bị tạm khoá. Liên hệ admin để mở lại.':'Bạn vừa đăng nhập ở thiết bị khác. Mỗi tài khoản chỉ dùng 1 thiết bị cùng lúc — để bạn tập trung & chánh niệm khi học.'; render(); }
let _saT=null;
function trimForSync(){
  const cap=(s,n)=>{ s=(s==null?'':String(s)); return s.length>n?s.slice(0,n):s; };
  const hist={}; Object.keys(S.history||{}).forEach(k=>{ hist[k]=(S.history[k]||[]).slice(0,8).map(x=>({ts:x.ts,score:x.score,dims:x.dims,by:x.by})); });
  const ans={}; Object.keys(S.ans||{}).forEach(k=>{ if(S.ans[k]) ans[k]=cap(S.ans[k],500); });
  const scores={}; Object.keys(S.scores||{}).forEach(k=>{ const x=S.scores[k]||{}; scores[k]={score:x.score,dims:x.dims,by:x.by,feedback:cap(x.feedback,220),tip:cap(x.tip,160)}; });
  let out={done:S.done,graded:S.graded,streak:S.streak,last:S.last,bounty:S.bounty,practices:S.practices,quiz:S.quiz,qans:S.qans,scen:S.scen,scores:scores,ans:ans,history:hist,cert:S.cert||null};
  try{ if(JSON.stringify(out).length>45000){ out.ans={}; } if(JSON.stringify(out).length>45000){ out.history={}; } }catch(e){}
  return out;
}
function syncAll(){ if(!CODE_MODE||!MEMBER||(MEMBER.role!=='member'&&MEMBER.role!=='guest')) return; clearTimeout(_saT); _saT=setTimeout(async()=>{ try{ const d=await api({action:'saveProgress',code:MEMBER.code,session:MEMBER.session,data:trimForSync()}); handleKick(d); }catch(e){} },2500); }
function syncPoints(){ syncAll(); }
let _hb=null;
function startHeartbeat(){ stopHeartbeat(); if(OPEN_MODE||!CODE_MODE||!MEMBER||MEMBER.role!=='member') return; _hb=setInterval(async()=>{ try{ const d=await api({action:'ping',code:MEMBER.code,session:MEMBER.session}); handleKick(d); }catch(e){} },20000); }
function stopHeartbeat(){ if(_hb){ clearInterval(_hb); _hb=null; } }
let _rankT=null;
function startRankRefresh(){ stopRankRefresh(); _rankT=setInterval(()=>{ if(UI.view==='rank') loadRank(); else stopRankRefresh(); },15000); }
function stopRankRefresh(){ if(_rankT){ clearInterval(_rankT); _rankT=null; } }
function applyProgress(p){ try{ p=p||{}; const L=S, m=Object.assign(dflt(),p);
  m.done=[...new Set([...(p.done||[]),...(L.done||[])])];
  m.bounty=Math.max(p.bounty||0,L.bounty||0); m.streak=Math.max(p.streak||0,L.streak||0); m.practices=Math.max(p.practices||0,L.practices||0); m.last=p.last||L.last;
  ['ans','scores','graded','scen','qans'].forEach(k=>{ m[k]=Object.assign({},p[k]||{},L[k]||{}); });
  m.history=Object.assign({},p.history||{},L.history||{}); m.chat=(L.chat&&L.chat.length)?L.chat:(p.chat||[]); m.quiz=p.quiz||L.quiz; m.cert=p.cert||L.cert||null;
  S=m; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ _mem=S; }
}catch(e){} }
async function doLogin(){
  const code=(val('logincode')||'').trim().toUpperCase(); if(!code){ UI.loginErr='Nhập mã đăng nhập'; render(); return; }
  UI.loginBusy=true; UI.loginErr=''; render();
  try{ const d=await api({action:'login',code});
    if(!d||!d.ok){ UI.loginBusy=false; UI.loginErr=(d&&d.error)||'Mã không đúng'; render(); return; }
    MEMBER={code,name:d.name,points:d.points||0,role:d.role,session:d.session||''};
    try{ localStorage.setItem('eqgym_code',code); localStorage.setItem('eqgym_session',MEMBER.session); }catch(e){}
    if(d.role==='member'){ if(d.progress){ applyProgress(d.progress); } else { S.bounty=d.points||0; save(); } startHeartbeat(); }
    UI.loginBusy=false; UI.loginErr=''; UI.adminLogin=false; sfx('success');
    if(d.role==='admin'){ openAdminCode(); } else { UI.view='home'; render(); }
  }catch(e){ UI.loginBusy=false; UI.loginErr='Lỗi kết nối, thử lại'; render(); }
}
function logoutMember(){ MEMBER=null; try{ localStorage.removeItem('eqgym_code'); localStorage.removeItem('eqgym_session'); }catch(e){} stopHeartbeat(); stopRankRefresh(); UI.settingsOpen=false; UI.adminLogin=false; UI.view='home'; render(); }
function guestStored(){ try{ return JSON.parse(localStorage.getItem('eqgym_guest')||'null'); }catch(e){ return null; } }
function guestLogout(){ MEMBER=null; try{ localStorage.removeItem('eqgym_guest'); }catch(e){} stopRankRefresh(); UI.settingsOpen=false; UI.view='home'; render(); }
async function doGuestJoin(){
  const name=(val('gname')||'').trim(); const email=(val('gemail')||'').trim().toLowerCase();
  if(!email||email.indexOf('@')<1){ UI.loginErr='Nhập email hợp lệ để bắt đầu'; render(); return; }
  UI.loginBusy=true; UI.loginErr=''; render();
  try{ const d=await api({action:'guest',name,email});
    if(!d||!d.ok){ UI.loginBusy=false; UI.loginErr=(d&&d.error)||'Lỗi, thử lại'; render(); return; }
    MEMBER={code:d.code,name:d.name,role:'guest',session:d.session||'',email};
    try{ localStorage.setItem('eqgym_guest',JSON.stringify({code:d.code,session:d.session,name:d.name,email})); }catch(e){}
    if(d.progress) applyProgress(d.progress);
    UI.loginBusy=false; UI.loginErr=''; UI.view='home'; sfx('success'); render();
  }catch(e){ UI.loginBusy=false; UI.loginErr='Lỗi kết nối, thử lại'; render(); }
}
function emailGate(){
  const g=guestStored()||{};
  return `<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#0F1923,#0A6E5D 135%)">
    <div style="text-align:center;color:#fff">
      <div style="width:76px;height:76px;margin:0 auto;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center">${LOGOW}</div>
      <h1 style="font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:18px 0 2px">EQ <span style="color:#0FB89B">GYM</span></h1>
      <p style="color:#B9C6D4;font-size:13px;font-weight:600;margin:0">Phòng tập cảm xúc · Bản dùng thử</p>
    </div>
    <div style="background:#fff;border-radius:22px;padding:22px 18px;margin-top:26px;box-shadow:0 18px 44px rgba(0,0,0,.3)">
      <h2 style="font-family:'Space Grotesk';font-size:17px;font-weight:700;margin:0 0 4px">Bắt đầu học thử ngay 🌱</h2>
      <p style="color:#5C6B7A;font-size:12.5px;font-weight:600;line-height:1.6;margin:0 0 14px">Nhập tên & email để lưu tiến độ và mở khoá Coach AI. Miễn phí, không cần mật khẩu.</p>
      <input id="gname" type="text" placeholder="Tên của bạn" value="${esc(g.name||'')}" autocomplete="name" style="width:100%;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:13px;padding:14px;font-size:15px;font-weight:600">
      <input id="gemail" type="email" inputmode="email" placeholder="Email" value="${esc(g.email||'')}" autocomplete="email" onkeydown="if(event.key==='Enter')doGuestJoin()" style="width:100%;margin-top:10px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:13px;padding:14px;font-size:15px;font-weight:600">
      ${UI.loginErr?`<p style="color:#E85B5B;font-size:12.5px;font-weight:700;margin:10px 0 0;text-align:center">${esc(UI.loginErr)}</p>`:''}
      <button onclick="doGuestJoin()" ${UI.loginBusy?'disabled':''} style="width:100%;margin-top:14px;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff;min-height:52px;opacity:${UI.loginBusy?.6:1}">${UI.loginBusy?'Đang vào...':'Vào phòng tập →'}</button>
      <p style="color:#8A97A5;font-size:10.5px;font-weight:600;margin:12px 0 0;text-align:center">🔒 Chỉ dùng để lưu tiến độ của bạn trong đợt dùng thử.</p>
    </div>
    <p style="text-align:center;margin:16px 0 0"><a onclick="UI.adminLogin=true;UI.loginErr='';render()" style="color:#7FA39B;font-size:11.5px;font-weight:700;cursor:pointer">Quản trị viên? Đăng nhập tại đây →</a></p>
  </div>`;
}
function openRank(){ sfx('tap'); UI.view='rank'; UI.rankData=null; render(); loadRank(); startRankRefresh(); window.scrollTo(0,0); }
async function loadRank(){ try{ const d=await api({action:'leaderboard',code:MEMBER.code,session:MEMBER.session}); if(handleKick(d)) return; if(d&&d.ok){ UI.rankData=d; render(); } }catch(e){} }
function openAdminCode(){ sfx('tap'); UI.settingsOpen=false; UI.view='admincode'; UI.newCode=null; UI.members=undefined; UI.adminTab='members'; render(); loadMembers(); window.scrollTo(0,0); }
function adminTabTo(t){ UI.adminTab=t; render(); if(t==='activity') loadActivity(); else loadMembers(); }
async function loadActivity(){ try{ const d=await api({action:'activity',admin:MEMBER.code}); if(d&&d.ok){ UI.activity=d.items; render(); } }catch(e){} }
async function adminSetStatus(code,status){ try{ const d=await api({action:'setStatus',admin:MEMBER.code,code,status}); if(d&&d.ok){ toast(status==='blocked'?'Đã khoá':'Đã mở khoá'); loadMembers(); } else toast((d&&d.error)||'Lỗi'); }catch(e){ toast('Lỗi'); } }
async function adminDelete(code,name){ if(!confirm('Xoá tài khoản "'+name+'" ('+code+')? Không thể hoàn tác.')) return; try{ const d=await api({action:'deleteMember',admin:MEMBER.code,code}); if(d&&d.ok){ toast('Đã xoá '+code); loadMembers(); } else toast((d&&d.error)||'Lỗi'); }catch(e){ toast('Lỗi'); } }
function evLabel(e){ return ({login:'🔓 Đăng nhập',register:'📝 Đăng ký',['code-issued']:'🔑 Cấp mã',blocked:'⛔ Khoá',unblocked:'✅ Mở khoá',deleted:'🗑️ Xoá',['reset-points']:'♻️ Reset điểm',['done-lesson']:'✅ Xong buổi',['open-workbook']:'📘 Mở workbook',certificate:'🎓 Chứng nhận'})[e]||e; }
async function adminCreate(){ const name=(val('newname')||'').trim(); if(!name){ toast('Nhập tên khách'); return; } UI.adminBusy=true; render(); try{ const d=await api({action:'createCode',admin:MEMBER.code,name}); if(d&&d.ok){ UI.newCode=d; UI.adminBusy=false; loadMembers(); render(); toast('Đã tạo mã cho '+d.name); } else { UI.adminBusy=false; toast((d&&d.error)||'Lỗi'); render(); } }catch(e){ UI.adminBusy=false; toast('Lỗi kết nối'); render(); } }
async function loadMembers(){ try{ const d=await api({action:'listMembers',admin:MEMBER.code}); if(d&&d.ok){ UI.members=d.members; render(); } }catch(e){} }
function copyCode(c){ try{ navigator.clipboard.writeText(c); toast('Đã copy mã '+c); }catch(e){} }
function viewLogin(){
  return `<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#0F1923,#0A6E5D 135%)">
    <div style="text-align:center;color:#fff">
      <div style="width:76px;height:76px;margin:0 auto;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center">${LOGOW}</div>
      <h1 style="font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:18px 0 2px">EQ <span style="color:#0FB89B">GYM</span></h1>
      <p style="color:#B9C6D4;font-size:13px;font-weight:600;margin:0">Phòng tập cảm xúc · 30 ngày</p>
    </div>
    <div style="background:#fff;border-radius:22px;padding:22px 18px;margin-top:26px;box-shadow:0 18px 44px rgba(0,0,0,.3)">
      <h2 style="font-family:'Space Grotesk';font-size:17px;font-weight:700;margin:0 0 4px">Nhập mã đăng nhập</h2>
      <p style="color:#5C6B7A;font-size:12.5px;font-weight:600;line-height:1.6;margin:0 0 14px">Mã do quản trị viên EQ GYM cấp sau khi xác nhận thanh toán. Chưa có mã? Liên hệ admin để được cấp.</p>
      <input id="logincode" type="text" autocapitalize="characters" placeholder="VD: EQ7K9M2" value="${esc(memberCode())}" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:13px;padding:15px;font-size:17px;font-weight:800;letter-spacing:2px;text-align:center;text-transform:uppercase">
      ${UI.loginErr?`<p style="color:#E85B5B;font-size:12.5px;font-weight:700;margin:10px 0 0;text-align:center">${esc(UI.loginErr)}</p>`:''}
      <button onclick="doLogin()" ${UI.loginBusy?'disabled':''} style="width:100%;margin-top:14px;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff;min-height:52px;opacity:${UI.loginBusy?.6:1}">${UI.loginBusy?'Đang kiểm tra...':'Vào phòng tập →'}</button>
    </div>
  </div>`;
}
function viewRank(){
  const d=UI.rankData; let rows='';
  if(d&&d.top){ if(!d.top.length) rows=`<p style="text-align:center;color:#5C6B7A;font-weight:600;padding:30px 0">Chưa có dữ liệu thi đua.</p>`;
    d.top.forEach(m=>{ const medal=m.rank===1?'🥇':m.rank===2?'🥈':m.rank===3?'🥉':('#'+m.rank); const me=d.me&&d.me.rank===m.rank;
      rows+=`<div style="display:flex;align-items:center;gap:12px;background:${me?'#EAFBF6':'#fff'};border:1px solid ${me?'#0FB89B':'#E3E8EE'};border-radius:14px;padding:12px 14px;margin-bottom:8px">
        <div style="width:38px;text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:${m.rank<=3?'20px':'14px'};color:${m.rank<=3?'#0F1923':'#5C6B7A'}">${medal}</div>
        <div style="flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}${me?' <span style=\"color:#0A6E5D;font-size:11px\">(bạn)</span>':''}</div>
        <div style="font-family:'Space Grotesk';font-weight:700;color:#0A6E5D">${fmt(m.points)}<span style="font-size:10px;color:#7FA39B;font-weight:700"> EP</span></div></div>`; });
  } else rows=`<p style="text-align:center;color:#5C6B7A;font-weight:600;padding:30px 0">Đang tải bảng thi đua...</p>`;
  return `<div style="animation:fade .25s">
    <div style="padding:calc(env(safe-area-inset-top) + 20px) 18px 6px"><h1 style="margin:0;font-family:'Space Grotesk';font-size:22px;font-weight:700">🏆 Đảo Thi Đua</h1><p style="margin:2px 0 0;color:#5C6B7A;font-size:12px;font-weight:700;letter-spacing:.3px">Xếp hạng theo tổng điểm rèn luyện (EP)${d&&d.total?' · '+d.total+' thành viên':''} · 🔄 tự cập nhật</p></div>

 "h"}, {"t": "3. Tôi đang tạo ra ảnh hưởng tích cực đến người khác ở mức nào?\n(0–10 điểm)", "k": "h"}, {"t": "Hoàn thành câu sau: Trong ba trụ cột này, điều tôi muốn phát triển nhất hiện nay là...", "k": "p"}, {"t": "Vì sao?\n\nTổng kết bài 3:", "k": "p"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Từ bài học tiếp theo, chúng ta sẽ bước vào Module đầu tiên: Hiểu mình.", "k": "p"}, {"t": "Bởi vì bạn không thể thay đổi điều mà bạn chưa nhận ra.", "k": "p"}, {"t": "Và năng lực đầu tiên của người có EQ cao không phải là điều tiết cảm xúc.", "k": "p"}, {"t": "Mà là gọi tên chính xác cảm xúc mình đang trải qua.", "k": "p"}]}]}, {"n": 4, "module": 1, "title": "ĐIỀU GÌ TẠO RA CẢM XÚC?", "subtitle": "", "duration": "", "objectives": ["Hiểu bản chất thật sự của cảm xúc.", "Biết cảm xúc được tạo ra từ não bộ, cơ thể và cách diễn giải, chứ không phải do sự kiện.", "Hiểu vì sao cùng một sự việc nhưng mỗi người có cảm xúc khác nhau.", "Phân biệt được cảm xúc tự nhiên (5–8 giây) và câu chuyện mình tiếp tục kể, từ đó bắt đầu dừng việc đổ lỗi cho cảm xúc."], "sections": [{"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Có bao giờ bạn nói: \"Anh làm em tức quá.\"", "k": "p"}, {"t": "Hay...\"Sếp làm tôi stress.\"", "k": "p"}, {"t": "Hay...\"Con làm tôi phát điên.\"", "k": "p"}, {"t": "Nếu điều đó đúng...Thì mọi người cùng gặp một người sếp sẽ phải có cùng một cảm xúc.", "k": "p"}, {"t": "Mọi đứa trẻ sẽ làm bố mẹ tức giống nhau.", "k": "p"}, {"t": "Mọi người bị tắc đường đều phải nổi giận.", "k": "p"}, {"t": "Nhưng thực tế không phải vậy.", "k": "p"}, {"t": "Cùng một sự việc...", "k": "p"}, {"t": "Có người bình tĩnh.", "k": "p"}, {"t": "Có người tức giận.", "k": "p"}, {"t": "Có người bật cười.", "k": "p"}, {"t": "Có người chẳng thấy gì.", "k": "p"}, {"t": "Vậy...Điều gì thật sự tạo ra cảm xúc?", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "1. Cảm xúc là gì?", "k": "h"}, {"t": "Cảm xúc không chỉ là một cảm giác.", "k": "p"}, {"t": "Cảm xúc là phản ứng sinh học và tâm lý giúp chúng ta thích nghi với cuộc sống.", "k": "p"}, {"t": "Nó giống như hệ thống cảnh báo của cơ thể.", "k": "p"}, {"t": "Không phải để chống lại bạn.", "k": "p"}, {"t": "Mà để bảo vệ bạn.", "k": "p"}, {"t": "2. Cảm xúc đến từ đâu?", "k": "h"}, {"t": "3. Cảm xúc chỉ tồn tại vài giây", "k": "h"}, {"t": "Đây là điều khiến nhiều người bất ngờ nhất.", "k": "p"}, {"t": "Phản ứng hóa học của cảm xúc trong cơ thể thường chỉ kéo dài khoảng 5–8 giây.", "k": "p"}, {"t": "Sau đó... Điều giữ cảm xúc ở lại không còn là hóa chất.", "k": "p"}, {"t": "Mà là...Câu chuyện chúng ta tiếp tục kể.", "k": "p"}, {"t": "Ví dụ:", "k": "p"}, {"t": "\"Cô ấy coi thường mình.\"", "k": "p"}, {"t": "\"Tại sao lúc nào cũng là mình?\"", "k": "p"}, {"t": "\"Mình thất bại thật rồi.\"", "k": "p"}, {"t": "Não tiếp tục kể.", "k": "p"}, {"t": "Cảm xúc tiếp tục tồn tại.", "k": "p"}, {"t": "Không phải vì cảm xúc kéo dài.", "k": "p"}, {"t": "Mà vì câu chuyện kéo dài.", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "Từ hôm nay...", "k": "p"}, {"t": "Mỗi khi có cảm xúc mạnh xuất hiện.", "k": "p"}, {"t": "Đừng vội hỏi:", "k": "p"}, {"t": "\"Làm sao để hết buồn?\"", "k": "p"}, {"t": "\"Làm sao để đừng giận?\"", "k": "p"}, {"t": "Hãy thử dừng lại.", "k": "p"}, {"t": "Và tự hỏi ba câu.", "k": "p"}, {"t": "1.Điều gì vừa xảy ra?", "k": "h"}, {"t": "(Sự kiện)", "k": "p"}, {"t": "2.Não mình đang diễn giải điều gì?", "k": "h"}, {"t": "(Câu chuyện)", "k": "p"}, {"t": "3.Cơ thể mình đang ở trạng thái nào?", "k": "h"}, {"t": "(Đói?", "k": "p"}, {"t": "Mệt?", "k": "p"}, {"t": "Thiếu ngủ?", "k": "p"}, {"t": "Căng thẳng?)", "k": "p"}, {"t": "Chỉ cần tách được ba điều này.", "k": "p"}, {"t": "Bạn đã bắt đầu bước ra khỏi phản ứng vô thức.", "k": "p"}, {"t": "Tổng hợp kiến thức bài 4", "k": "p"}]}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Mỗi khi có một cảm xúc mạnh xuất hiện.", "k": "p"}, {"t": "Hãy ghi lại theo mẫu.", "k": "p"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Trong bài học này, bạn đã khám phá rằng cảm xúc không được tạo ra chỉ bởi những gì xảy ra bên ngoài.", "k": "p"}, {"t": "Ở bài học tiếp theo, chúng ta sẽ đi sâu hơn vào một năng lực cốt lõi của EQ: gọi tên cảm xúc một cách chính xác.", "k": "p"}, {"t": "Bởi vì nghiên cứu của Six Seconds chỉ ra rằng: bạn chỉ có thể điều hướng được điều mà bạn gọi tên được. Càng có vốn từ cảm xúc phong phú, bạn càng hiểu rõ dữ liệu mà cảm xúc đang mang đến và vì nó làm rõ một thông điệp cốt lõi: sự kiện không trực tiếp tạo ra cảm xúc; điều tạo nên trải nghiệm cảm xúc lâu dài chính là cách não bộ diễn giải và câu chuyện chúng ta tiếp tục kể với chính mình.", "k": "p"}]}]}, {"n": 5, "module": 1, "title": "THÔNG ĐIỆP CỦA CẢM XÚC", "subtitle": "Đừng vội chống lại cảm xúc. Hãy lắng nghe điều nó đang cố nói với bạn.", "duration": "6–7 phút", "objectives": ["Hiểu cảm xúc là nguồn dữ liệu quan trọng, không phải mệnh lệnh phải làm theo.", "Biết phân biệt giữa cảm xúc và thông điệp của cảm xúc.", "Hiểu rằng phía sau mỗi cảm xúc đều phản ánh một nhu cầu hoặc một giá trị đang được đáp ứng hoặc bị tác động.", "Bắt đầu hình thành thói quen lắng nghe cảm xúc trước khi phản ứng."], "sections": [{"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Bạn đã bao giờ tự hỏi: Tại sao mình lại tức giận?", "k": "p"}, {"t": "Tại sao mình lại buồn?", "k": "p"}, {"t": "Tại sao có những chuyện rất nhỏ nhưng lại khiến mình phản ứng rất mạnh?", "k": "p"}, {"t": "Nhiều người nghĩ:", "k": "p"}, {"t": "\"Cảm xúc là vấn đề.\"", "k": "p"}, {"t": "Nhưng thực ra.", "k": "p"}, {"t": "Cảm xúc không phải vấn đề.", "k": "p"}, {"t": "Điều khiến chúng ta khổ thường không phải cảm xúc.", "k": "p"}, {"t": "Mà là vì chúng ta không hiểu điều cảm xúc đang muốn nói.", "k": "p"}, {"t": "Giống như đèn báo xăng trên ô tô.", "k": "p"}, {"t": "Đèn sáng không phải để làm bạn khó chịu.", "k": "p"}, {"t": "Đèn sáng để báo rằng:", "k": "p"}, {"t": "\"Đã đến lúc cần chú ý.\"", "k": "p"}, {"t": "Cảm xúc cũng như vậy.", "k": "p"}, {"t": "Nó luôn mang theo một thông điệp.", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "Cảm xúc giống như bảng điều khiển trên xe", "k": "h"}, {"t": "Hãy tưởng tượng bạn đang lái xe.", "k": "p"}, {"t": "Bỗng một đèn màu đỏ bật sáng.", "k": "p"}, {"t": "Bạn sẽ làm gì?", "k": "p"}, {"t": "Đập vỡ bóng đèn?", "k": "p"}, {"t": "Hay kiểm tra xem xe đang gặp điều gì?", "k": "p"}, {"t": "Cảm xúc cũng vậy.", "k": "p"}, {"t": "Nó không đến để làm khó bạn.", "k": "p"}, {"t": "Nó đến để cung cấp dữ liệu.", "k": "p"}, {"t": "Điều cảm xúc phản ánh", "k": "h"}, {"t": "Phía sau mỗi cảm xúc thường là:", "k": "p"}, {"t": "Một nhu cầu đang được đáp ứng hoặc chưa được đáp ứng.", "k": "p"}, {"t": "Một giá trị đang được tôn trọng hoặc bị xâm phạm.", "k": "p"}, {"t": "Ví dụ:", "k": "p"}, {"t": "😊 Vui → Có điều quan trọng đang được đáp ứng.", "k": "p"}, {"t": "😢 Buồn → Đang mất mát hoặc thiếu điều mình trân trọng.", "k": "p"}, {"t": "😡 Giận → Có ranh giới hoặc giá trị bị xâm phạm.", "k": "p"}, {"t": "😨 Lo lắng → Não đang nhận thấy điều gì đó chưa chắc chắn hoặc có nguy cơ.", "k": "p"}, {"t": "Không có cảm xúc nào vô nghĩa.", "k": "p"}, {"t": "Mỗi cảm xúc đều mang theo một thông điệp.", "k": "p"}, {"t": "Điều cần nhớ", "k": "h"}, {"t": "Cảm xúc chỉ mang thông tin.", "k": "p"}, {"t": "Còn hành động là do bạn lựa chọn.", "k": "p"}, {"t": "Đó là lý do: Cảm xúc là dữ liệu, không phải mệnh lệnh.", "k": "p"}, {"t": "MÔ HÌNH THAM KHẢO", "k": "p"}, {"t": "Đừng hỏi: \"Làm sao hết cảm xúc?\"\nHãy hỏi: \"Cảm xúc này đang muốn nói điều gì?\"", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": []}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Bước 1: Dừng lại.", "k": "h"}, {"t": "Đừng phản ứng ngay.", "k": "p"}, {"t": "Bước 2: Gọi tên cảm xúc.", "k": "h"}, {"t": "Ví dụ:", "k": "p"}, {"t": "Tôi đang thất vọng.", "k": "p"}, {"t": "Tôi đang lo lắng.", "k": "p"}, {"t": "Tôi đang biết ơn.", "k": "p"}, {"t": "Bước 3: Điều nh nhân chỉ nói:", "k": "p"}, {"t": "\"Tôi thấy không khỏe.\"", "k": "p"}, {"t": "Thì rất khó để chẩn đoán.", "k": "p"}, {"t": "Não bộ cũng vậy.", "k": "p"}, {"t": "Nó cần một \"từ khóa\" đủ chính xác.", "k": "p"}, {"t": "Và đó là lý do chúng ta sử dụng Bánh xe cảm xúc.", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "Bánh xe cảm xúc là gì?", "k": "h"}, {"t": "Đó là một bản đồ cảm xúc giúp bạn đi từ một cảm giác rất mơ hồ => Một cảm xúc rất cụ thể.", "k": "p"}, {"t": "Hãy quan sát.", "k": "p"}, {"t": "Bánh xe được chia thành nhiều lớp.", "k": "p"}, {"t": "Lớp thứ nhất là những nhóm cảm xúc lớn.", "k": "h"}, {"t": "Ví dụ:", "k": "p"}, {"t": "😊 Vui", "k": "p"}, {"t": "😢 Buồn", "k": "p"}, {"t": "😨 Sợ", "k": "p"}, {"t": "😡 Giận", "k": "p"}, {"t": "😲 Ngạc nhiên", "k": "p"}, {"t": "🤢 Ghê sợ", "k": "p"}, {"t": "Đây chỉ là điểm bắt đầu.", "k": "p"}, {"t": "Lớp thứ hai", "k": "h"}, {"t": "Mỗi nhóm cảm xúc lại được chia nhỏ hơn.", "k": "p"}, {"t": "Ví dụ.", "k": "p"}, {"t": "Nếu bạn chọn", "k": "p"}, {"t": "😢 Buồn", "k": "p"}, {"t": "Bạn sẽ thấy:", "k": "p"}, {"t": "Thất vọng", "k": "p"}, {"t": "Tổn thương", "k": "p"}, {"t": "Cô đơn", "k": "p"}, {"t": "Bất lực", "k": "p"}, {"t": "Hối tiếc", "k": "p"}, {"t": "Trống rỗng", "k": "p"}, {"t": "Mỗi từ đều khác nhau.", "k": "p"}, {"t": "Mỗi từ đều mang một thông điệp khác nhau.", "k": "p"}, {"t": "Lớp ngoài cùng", "k": "h"}, {"t": "Là nơi bạn tìm được cảm xúc gần nhất với trải nghiệm của mình.", "k": "p"}, {"t": "Ví dụ.", "k": "p"}, {"t": "Thay vì nói:", "k": "p"}, {"t": "\"Tôi buồn.\"", "k": "p"}, {"t": "Bạn nhận ra:", "k": "p"}, {"t": "\"Tôi đang thất vọng.\"", "k": "p"}, {"t": "Hoặc", "k": "p"}, {"t": "\"Tôi đang tủi thân.\"", "k": "p"}, {"t": "Hay", "k": "p"}, {"t": "\"Tôi đang tiếc nuối.\"", "k": "p"}, {"t": "Ngay khi đổi được từ...", "k": "p"}, {"t": "Bạn sẽ thấy cảm xúc trở nên rõ ràng hơn rất nhiều.", "k": "p"}, {"t": "Một ví dụ", "k": "p"}, {"t": "Sếp góp ý trước cuộc họp.", "k": "p"}, {"t": "Ban đầu. \"Tôi khó chịu.\"", "k": "p"}, {"t": "Bạn mở Bánh xe cảm xúc", "k": "p"}, {"t": "Đi từ trong ra ngoài.", "k": "p"}, {"t": "Không. Không phải khó chịu.", "k": "p"}, {"t": "Không phải tức.", "k": "p"}, {"t": "À...\"Mình đang cảm thấy xấu hổ.\"", "k": "p"}, {"t": "Ngay lập tức.", "k": "p"}]}, {"h": "THÔNG ĐIỆP", "practice": false, "items": [{"t": "Bạn không còn tập trung vào việc trách sếp.", "k": "p"}, {"t": "Bạn bắt đầu hiểu điều gì đang quan trọng với mình.", "k": "p"}, {"t": "Đó chính là sức mạnh của việc gọi tên cảm xúc.", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "Từ hôm nay.", "k": "p"}, {"t": "Mỗi khi có cảm xúc mạnh.", "k": "p"}, {"t": "Hãy thực hiện nghi thức của EQ GYM.", "k": "p"}, {"t": "Bước 1: Dừng lại. Hít một hơi thật sâu.", "k": "h"}, {"t": "Bước 2: Mở Bánh xe cảm xúc", "k": "h"}, {"t": "Bước 3: Bắt đầu từ vòng trong. Chọn nhóm cảm xúc gần nhất.", "k": "h"}, {"t": "Bước 4: Đi dần ra vòng ngoài.", "k": "h"}, {"t": "Đừng chọn nhanh.", "k": "p"}, {"t": "Hãy tìm từ khiến bạn thấy: \"Đúng rồi! Chính là nó.\"", "k": "p"}, {"t": "Bước 5: Hoàn thành câu” Lúc này...Tôi đang cảm thấy...", "k": "h"}, {"t": "(chỉ dùng tên cảm xúc)", "k": "p"}]}, {"h": "TỔNG KẾT", "practice": false, "items": []}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Trong 24 giờ tới, Ít nhất 03 lần hãy mở bánh xe cảm xúc", "k": "p"}, {"t": "Dành khoảng 30 giây.", "k": "p"}, {"t": "Đi từ trong ra ngoài.", "k": "p"}, {"t": "Tìm đúng từ.", "k": "p"}, {"t": "Sau đó ghi lại.", "k": "p"}, {"t": "2. Trả lời ba câu hỏi vào cuối ngày", "k": "p"}, {"t": "- Từ cảm xúc nào hôm nay khiến tôi bất ngờ nhất?", "k": "h"}, {"t": "- Bánh xe cảm xúc giúp tôi hiểu rõ điều gì hơn về bản thân?", "k": "h"}, {"t": "- Nếu không mở bánh xe cảm xúc, có lẽ tôi đã phản ứng khác như thế nào?", "k": "h"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Đến đây, bạn đã biết cách gọi tên cảm xúc chính xác hơn.", "k": "p"}, {"t": "Nhưng gọi tên mới chỉ là bước đầu.", "k": "p"}, {"t": "Điều quan trọng hơn là: Điều gì đang tạo nên cảm xúc đó?", "k": "p"}, {"t": "Trong bài học tiếp theo, chúng ta sẽ khám phá một câu hỏi rất quan trọng:", "k": "p"}, {"t": "\"Nhu cầu nào của tôi đang được đáp ứng hoặc chưa được đáp ứng?\"", "k": "p"}, {"t": "Bởi vì phía sau mọi cảm xúc luôn có một nhu cầu đang muốn được lắng nghe.", "k": "p"}]}]}, {"n": 8, "module": 1, "title": "NHU CẦU PHÍA SAU CẢM XÚC", "subtitle": "Mỗi cảm xúc đều đang bảo vệ một nhu cầu.", "duration": "", "objectives": ["Hiểu rằng phía sau mọi cảm xúc đều có một nhu cầu.", "Phân biệt giữa nhu cầu và mong muốn.", "Biết kết nối cảm xúc với nhu cầu.", "Ngừng đổ lỗi cho người khác về cảm xúc của mình."], "sections": [{"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Một người chồng về nhà trễ.", "k": "p"}, {"t": "Người vợ nổi giận.", "k": "p"}, {"t": "Có phải...", "k": "p"}, {"t": "Người vợ giận vì chồng về muộn?", "k": "p"}, {"t": "......", "k": "p"}, {"t": "Không hẳn.", "k": "p"}, {"t": "Có người không hề giận.", "k": "p"}, {"t": "Có người lại rất tổn thương.", "k": "p"}, {"t": "Có người chỉ lo lắng.", "k": "p"}, {"t": "Cùng một sự kiện.", "k": "p"}, {"t": "Ba cảm xúc khác nhau.", "k": "p"}, {"t": "Điều gì tạo nên sự khác biệt?", "k": "p"}, {"t": "Bởi vì...", "k": "p"}, {"t": "Phía sau cảm xúc...", "k": "p"}, {"t": "Luôn là một nhu cầu.", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "Emotion =>Need => Choice", "k": "p"}, {"t": "Cảm xúc giống như chiếc đèn báo.", "k": "p"}, {"t": "Nhu cầu giống như động cơ bên dưới.", "k": "p"}, {"t": "Ví dụ.", "k": "p"}, {"t": "😡 Giận => Nhu cầu được tôn trọng.", "k": "p"}, {"t": "😢 Buồn => Nhu cầu kết nối.", "k": "p"}, {"t": "😰 Lo lắng =>  Nhu cầu an toàn.", "k": "p"}, {"t": "😊 Vui => Một nhu cầu đang được đáp ứng.", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "Khi có cảm xúc, đừng dừng ở:", "k": "p"}, {"t": "\"Tôi đang giận.\"", "k": "p"}, {"t": "Hãy hỏi tiếp.: \"Mình đang cần điều gì?\ : "Ban đầu...", "k": "p"}, {"t": "Bạn lựa chọn.", "k": "p"}, {"t": "Sau nhiều lần.", "k": "p"}, {"t": "Não bộ lựa chọn thay bạn.", "k": "p"}, {"t": "Đó chính là mô thức.", "k": "p"}, {"t": "Ví dụ", "k": "h"}, {"t": "Một người luôn nghĩ: \"Tôi phải làm hoàn hảo.\"", "k": "p"}, {"t": "Mỗi lần bị góp ý => Cảm thấy xấu hổ => Làm nhiều hơn => Kiệt sức=> Lần sau vẫn như vậy.", "k": "p"}, {"t": "Đó là một mô thức.", "k": "p"}, {"t": "Ba loại mô thức phổ biến", "k": "h"}, {"t": "Mô thức suy nghĩ", "k": "h"}, {"t": "\"Tôi không đủ giỏi.\"", "k": "p"}, {"t": "\"Tôi phải làm hài lòng mọi người.\"", "k": "p"}, {"t": "Mô thức cảm xúc", "k": "h"}, {"t": "Dễ lo.", "k": "p"}, {"t": "Dễ giận.", "k": "p"}, {"t": "Dễ tự trách.", "k": "p"}, {"t": "Mô thức hành vi", "k": "h"}, {"t": "Im lặng.", "k": "p"}, {"t": "Trì hoãn.", "k": "p"}, {"t": "Kiểm soát.", "k": "p"}, {"t": "Làm quá sức.", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "Cách nhận diện mô thức", "k": "h"}, {"t": "Đừng hỏi:\"Tại sao chuyện này lại xảy ra?\"", "k": "p"}, {"t": "Hãy hỏi: Điều gì đang lặp lại?", "k": "p"}, {"t": "Mỗi khi có cảm xúc mạnh, hãy tự hỏi.", "k": "p"}, {"t": "Đây có phải lần đầu tiên mình phản ứng như vậy không?", "k": "h"}, {"t": "Mình đã từng phản ứng giống thế này ở đâu?", "k": "h"}, {"t": "3.Kết quả cuối cùng có giống nhau không?", "k": "h"}, {"t": "Nếu câu trả lời là: \"Có.\"", "k": "p"}, {"t": "Rất có thể bạn vừa phát hiện một mô thức.", "k": "p"}, {"t": "TỒNG KẾT BÀI 9", "k": "p"}]}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Nhật ký mô thức", "k": "h"}, {"t": "Trong tuần này, mỗi khi có một cảm xúc mạnh. Hãy ghi lại.", "k": "p"}, {"t": "Hoàn thành ba câu.", "k": "p"}, {"t": "Mô thức tôi nhận ra rõ nhất là...", "k": "p"}, {"t": "Mô thức này đang giúp gì cho tôi?", "k": "p"}, {"t": "Và đang khiến tôi phải trả giá điều gì?", "k": "p"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Nhận ra mô thức không phải để trách bản thân.", "k": "p"}, {"t"  ngay cả khi không còn hứng thú, không được ghi nhận hoặc kết quả chưa xuất hiện?", "k": "p"}, {"t": "Đó chính là động lực nội tại.", "k": "p"}, {"t": "Quote: Một quyết định trưởng thành không chỉ giải quyết cảm xúc hiện tại. Nó còn bảo vệ tương lai mà bạn muốn kiến tạo.", "k": "p"}]}]}, {"n": 23, "module": 3, "title": "LẮNG NGHE ĐỂ KẾT NỐI", "subtitle": "Người ta không cần bạn giải quyết ngay. Người ta cần được hiểu trước.", "duration": "6–7 phút", "objectives": ["Hiểu 4 cấp độ lắng nghe.", "Biết khi nào nên hỏi thay vì khuyên.", "Biết lắng nghe cảm xúc phía sau lời nói.", "Biết lắng nghe nhu cầu chưa được nói ra.", "Xây dựng kết nối sâu sắc hơn trong các mối quan hệ."], "sections": [{"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Có bao giờ bạn chia sẻ một chuyện rất khó khăn.", "k": "p"}, {"t": "Người kia lập tức nói: \"Nếu là mình...\"", "k": "p"}, {"t": "Hoặc: \"Bạn nên...\"", "k": "p"}, {"t": "Hoặc: \"Có gì đâu.\"", "k": "p"}, {"t": "Điều đó khiến bạn cảm thấy thế nào?", "k": "p"}, {"t": "Đa số mọi người không tìm đến chúng ta để xin lời khuyên.", "k": "p"}, {"t": "Họ tìm đến vì muốn được hiểu.", "k": "p"}, {"t": "Điều thú vị là: Con người chỉ sẵn sàng lắng nghe sau khi họ cảm thấy mình đã được lắng nghe.", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "Lắng nghe không chỉ có một mức độ", "k": "p"}, {"t": "Có bốn cấp độ lắng nghe.", "k": "p"}, {"t": ".", "k": "p"}, {"t": "Ví dụ.", "k": "p"}, {"t": "\"Tôi rất tức.\"", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "Có thể nhu cầu là:", "k": "p"}, {"t": "được tôn trọng", "k": "p"}, {"t": "được ghi nhận", "k": "p"}, {"t": "được công bằng", "k": "p"}, {"t": "MÔ HÌNH TỔNG QUÁT", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "5 bước lắng nghe kết nối", "k": "p"}, {"t": "Ví dụ", "k": "p"}, {"t": "Đồng nghiệp nói: \"Mình chán công việc quá.\"", "k": "p"}, {"t": "Thông thường.", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "\"Cố lên.\"", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "Không có kết nối.", "k": "p"}, {"t": "Lắng nghe.", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "\"Có vẻ gần đây bạn rất mệt.\"", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "\"Điều gì đang làm bạn mất năng lượng nhất?\"", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "Người kia bắt đầu mở lòng.", "k": "p"}]}, {"h": "TỔNG KẾT", "practice": false, "items": []}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Thử thách 10 phút lắng nghe", "k": "p"}, {"t": "Trong hôm nay.", "k": "p"}, {"t": "Hãy chọn một người.", "k": "p"}, {"t": "Dành 10 phút.", "k": "p"}, {"t": "Chỉ lắng nghe.", "k": "p"}, {"t": "Không khuyên.", "k": "p"}, {"t": "Không kể chuyện của mình.", "k": "p"}, {"t": "Sau đó ghi lại.", "k": "p"}, {"t": "Tôi nghe được nội dung gì?", "k": "p"}, {"t": "Cảm xúc gì?", "k": "p"}, {"t": "Chiêm nghiệm", "k": "p"}, {"t": "Tôi thường ngắt lời ở thời điểm nào?", "k": "p"}, {"t": "Tôi thích khuyên hay thích hỏi?", "k": "p"}, {"t": "Lần gần nhất tôi cảm thấy được lắng nghe là khi nào? Điều gì khiến tôi có cảm giác đó?", "k": "p"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Lắng nghe không phải là chờ đến lượt mình nói.", "k": "p"}, {"t": "Lắng nghe là tạo ra một không gian để người khác hiểu rõ chính họ hơn.", "k": "p"}, {"t": "Ở bài học tiếp theo.", "k": "p"}, {"t": "Chúng ta sẽ học cách:", "k": "p"}, {"t": "Tạo niềm tin khi giao tiếp", "k": "p"}, {"t": "QUOTE: \"Người khác không nhớ bạn đã nói gì nhiều nhất. Họ nhớ cảm giác khi được ở cạnh bạn.\"", "k": "p"}]}]}, {"n": 24, "module": 3, "title": "GÓP Ý SAO CHO NGƯỜI KHÁC NGHE?", "subtitle": "Phân biệt phản hồi với phán xét.", "duration": "1 phút", "objectives": [], "sections": [{"h": "", "practice": false, "items": [{"t": "Biết mô tả dữ kiện thay vì gắn nhãn con người.", "k": "p"}, {"t": "Biết nói rõ cảm xúc, tác động và mong muốn của mình mà không tấn công người khác.", "k": "p"}, {"t": "Giảm phản ứng phòng vệ trong những cuộc trao đổi khó.", "k": "p"}, {"t": "Biết sử dụng quy trình giao tiếp bốn bước để xử lý bất đồng và xung đột.", "k": "p"}, {"t": "Tạo ra sự rõ ràng mà vẫn duy trì niềm tin trong mối quan hệ.", "k": "p"}]}, {"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Có bao giờ bạn giữ im lặng rất lâu vì sợ mất lòng?", "k": "p"}, {"t": "Bạn thấy đồng nghiệp liên tục trễ hạn.", "k": "p"}, {"t": "Bạn khó chịu.", "k": "p"}, {"t": "Nhưng không nói.", "k": "p"}, {"t": "Bạn thấy người thân có một hành vi làm mình tổn thương.", "k": "p"}, {"t": "Bạn muốn góp ý.", "k": "p"}, {"t": "Nhưng lại nghĩ: “Thôi, nói ra lại cãi nhau.”", "k": "p"}, {"t": "Bạn cố chịu.", "k": "p"}, {"t": "Cố nhịn.", "k": "p"}, {"t": "Cố tỏ ra không có chuyện gì.", "k": "p"}, {"t": "Cho đến một ngày, chỉ vì một việc rất nhỏ, bạn bùng nổ:", "k": "p"}, {"t": "“Lúc nào bạn cũng như vậy!”", "k": "p"}, {"t": "“Bạn chẳng bao giờ nghĩ đến người khác!”", "k": "p"}, {"t": "Điều đáng tiếc là lúc ấy, vấn đề thật sự gần như biến mất.", "k": "p"}, {"t": "Cuộc trò chuyện không còn tập trung vào điều đã xảy ra.", "k": "p"}, {"t": "Mà chuyển thành cuộc chiến xem:", "k": "p"}, {"t": "Ai đúng?", "k": "p"}, {"t": "Ai sai?", "k": "p"}, {"t": "Ai là người có lỗi?", "k": "p"}, {"t": "Niềm tin không mất đi vì chúng ta nói về vấn đề.", "k": "p"}, {"t": "Niềm tin thường mất đi vì cách chúng ta nói về vấn đề.", "k": "p"}, {"t": "Giao tiếp bằng EQ không phải là né tránh điều khó.", "k": "p"}, {"t": "Mà là đủ rõ ràng để nói sự thật và đủ thấu cảm để không biến sự thật thành vũ khí.", "k": "p"}, {"t": "GIAO TIẾP TẠO NIỀM TIN LÀ GÌ?", "k": "p"}, {"t": "Giao tiếp tạo niềm tin gồm hai yếu tố:", "k": "p"}, {"t": "Rõ ràng với vấn đề – Tôn trọng con người.", "k": "p"}, {"t": "Bạn không cần lựa chọn giữa:", "k": "p"}, {"t": "Nói thật nhưng làm người khác tổn thương.", "k": "p"}, {"t": "Giữ hòa khí nhưng bỏ qua vấn đề.", "k": "p"}, {"t": "Bạn có thể làm cả hai:", "k": "p"}, {"t": "Nói rõ điều cần thay đổi và vẫn giữ được sự tôn trọng.", "k": "p"}, {"t": "1. Phán xét khác phản hồi như thế nào?", "k": "p"}, {"t": "Phán xét", "k": "p"}, {"t": "Tập trung vào con người:", "k": "p"}, {"t": "“Bạn thiếu trách nhiệm.”", "k": "p"}, {"t": "“Bạn quá ích kỷ.”", "k": "p"}, {"t": "“Bạn không biết lắng nghe.”", "k": "p"}, {"t": "“Lúc nào bạn cũng làm hỏng việc.”", "k": "p"}, {"t": "Phán xét thường tạo ra:", "k": "p"}, {"t": "Phòng vệ.", "k": "p"}, {"t": "Phản bác.", "k": "p"}, {"t": "Xấu hổ.", "k": "p"}, {"t": "Mất kết nối.", "k": "p"}, {"t": "Phản hồi", "k": "p"}, {"t": "Tập trung vào điều có thể quan sát:", "k": "p"}, {"t": "“Báo cáo được gửi sau thời hạn hai ngày.”", "k": "p"}, {"t": "“Trong cuộc họp vừa rồi, bạn ngắt lời tôi ba lần.”", "k": "p"}, {"t": "“Tuần này có hai đầu việc chưa được cập nhật.”", "k": "p"}, {"t": "“Khi tôi đang trình bày, bạn rời khỏi phòng.”", "k": "p"}, {"t": "Phản hồi giúp hai người cùng nhìn vào một sự việc, thay vì biến người kia thành vấn đề.", "k": "p"}, {"t": "2. Dữ kiện khác diễn giải", "k": "p"}, {"t": "Hãy phân biệt: \nDữ kiện “Bạn chưa trả lời tin nhắn của tôi trong hai ngày.”", "k": "p"}, {"t": "Diễn giải “Bạn không coi trọng tôi.”", "k": "p"}, {"t": "Dữ kiện là điều camera có thể ghi lại.", "k": "p"}, {"t": "Diễn giải là câu chuyện do tâm trí tạo ra.", "k": "p"}, {"t": "Khi giao tiếp bằng diễn giải, người kia thường phản bác:", "k": "p"}, {"t": "“Tôi đâu có không coi trọng bạn.”", "k": "p"}, {"t": "Khi giao tiếp bằng dữ kiện, hai người có cơ sở rõ ràng để cùng trao đổi.", "k": "p"}, {"t": "3. Cảm xúc khác lời buộc tội", "k": "p"}, {"t": "Đây là cảm xúc:", "k": "p"}, {"t": "Tôi lo lắng.", "k": "p"}, {"t": "Tôi thất vọng.", "k": "p"}, {"t": "Tôi bối rối.", "k": "p"}, {"t": "Tôi cảm thấy áp lực.", "k": "p"}, {"t": "Đây chưa hẳn là cảm xúc:", "k": "p"}, {"t": "Tôi cảm thấy bị xem thường.", "k": "p"}, {"t": "Tôi cảm thấy bị phản bội.", "k": "p"}, {"t": "Tôi cảm thấy bạn cố tình chống đối.", "k": "p"}, {"t": "Những câu sau đã chứa sự diễn giải về ý định của người khác.", "k": "p"}, {"t": "Khi nói đúng cảm xúc của mình, bạn đang chịu trách nhiệm về trải nghiệm bên trong thay vì đổ lỗi.", "k": "p"}, {"t": "MÔ HÌNH TỔNG QUAN", "k": "p"}, {"t": "QUY TRÌNH GIAO TIẾP TẠO NIỀM TIN", "k": "p"}, {"t": "Hãy sử dụng công thức năm bước:", "k": "p"}, {"t": "Bước 1: Nói dữ kiện", "k": "p"}, {"t": "Chỉ mô tả điều có thể quan sát được.", "k": "p"}, {"t": "Không dùng:", "k": "p"}, {"t": "Luôn luôn.", "k": "p"}, {"t": "Chẳng bao giờ.", "k": "p"}, {"t": "Vô trách nhiệm.", "k": "p"}, {"t": "Ích kỷ.", "k": "p"}, {"t": "Cố tình.", "k": "p"}, {"t": "Ví dụ:", "k": "p"}, {"t": "“Trong hai tuần vừa rồi, có ba báo cáo được gửi sau thời hạn.”", "k": "p"}, {"t": "Bước 2: Nói cảm xúc của mình", "k": "p"}, {"t": "Không đổ lỗi.", "k": "p"}, {"t": "“Tôi cảm thấy lo lắng và khá áp lực.”", "k": "p"}, {"t": "Không nói:", "k": "p"}, {"t": "“Bạn làm tôi phát điên.”", "k": "p"}, {"t": "Thay vào đó:", "k": "p"}, {"t": "“Khi việc này xảy ra, tôi cảm thấy rất căng thẳng.”", "k": "p"}, {"t": "Bước 3: Nêu tác động", "k": "p"}, {"t": "Giúp người kia hiểu vì sao vấn đề này cần được xử lý.", "k": "p"}, {"t": "“Điều này khiến tiến độ của cả nhóm bị chậm và những người khác phải điều chỉnh công việc.”", "k": "p"}, {"t": "Tác động phải cụ thể, không phóng đại.", "k": "p"}, {"t": "Bước 4: Kết nối với nhu cầu hoặc giá trị", "k": "p"}, {"t": "“Tôi coi trọng sự chủ động và cam kết trong đội nhóm.”", "k": "p"}, {"t": "Hoặc:", "k": "p"}, {"t": "“Tôi cần sự rõ ràng để có thể sắp xếp công việc.”", "k": "p"}, {"t": "Đây là bước giúp cuộc trò chuyện vượt ra khỏi chuyện đúng sai và quay về điều quan trọng.", "k": "p"}, {"t": "Bước 5: Đưa ra đề nghị rõ ràng", "k": "p"}, {"t": "Không nói:", "k": "p"}, {"t": "“Bạn phải có trách nhiệm hơn.”", "k": "p"}, {"t": "Hãy nói:", "k": "p"}, {"t": "“Từ tuần tới, bạn có thể cập nhật tiến độ trước 4 giờ chiều thứ Năm không?”", "k": "p"}, {"t": "Đề nghị tốt cần:", "k": "p"}, {"t": "Cụ thể.", "k": "p"}, {"t": "Có thể thực hiện.", "k": "p"}, {"t": "Có thời gian rõ ràng.", "k": "p"}, {"t": "Có quyền trao đổi và điều chỉnh.", "k": "p"}, {"t": "VÍ DỤ", "k": "p"}, {"t": "Thay vì nói: “Bạn lúc nào cũng thiếu trách nhiệm. Tôi không thể tin bạn được.”", "k": "p"}, {"t": "Hãy thử: “Trong hai tuần vừa rồi, ba báo cáo được gửi sau thời hạn. Tôi cảm thấy khá áp lực vì tiến độ của cả nhóm bị ảnh hưởng. Tôi coi trọng sự chủ động và cam kết. Từ tuần tới, bạn có thể gửi cập nhật trước 4 giờ chiều thứ Năm, hoặc báo sớm nếu có nguy cơ trễ hạn không?”", "k": "p"}, {"t": "Vấn đề vẫn được nói rất rõ. Nhưng con người không bị tấn công.", "k": "p"}, {"t": "KHI NGƯỜI KHÁC PHÒNG VỆ", "k": "p"}, {"t": "Ngay cả khi bạn nói cẩn thận, người kia vẫn có thể phản ứng:", "k": "p"}, {"t": "“Tại sao chỉ nói mình tôi?”", "k": "p"}, {"t": "“Bạn cũng đâu có hoàn hảo.”", "k": "p"}, {"t": "“Tôi bận quá thì làm sao?”", "k": "p"}, {"t": "Đừng vội phản công.", "k": "p"}, {"t": "Hãy quay về thấu cảm: “Tôi nghe thấy bạn đang cảm thấy bị áp lực và có vẻ chưa được nhìn nhận đầy đủ.”", "k": "p"}, {"t": "Sau đó giữ trọng tâm: “Tôi muốn hiểu khó khăn của bạn. Đồng thời, chúng ta vẫn cần tìm cách bảo vệ tiến độ chung.”", "k": "p"}, {"t": "Đây là giao tiếp trưởng thành: Không bỏ rơi con người, cũng không bỏ qua vấn đề.", "k": "p"}]}, {"h": "TỔNG KẾT", "practice": false, "items": []}, {"h": "BÀI TẬP THỰC HÀNH", "practice": true, "items": [{"t": "Chọn một cuộc trao đổi bạn đang trì hoãn.", "k": "p"}, {"t": "Viết trước theo mẫu sau:", "k": "p"}, {"t": "Sau đó ghép thành một đoạn:", "k": "p"}, {"t": "“Khi tôi quan sát thấy… tôi cảm thấy… vì điều này ảnh hưởng đến… Điều quan trọng với tôi là… Tôi mong chúng ta có thể…”", "k": "p"}, {"t": "Cuối ngày, hãy trả lời:", "k": "p"}, {"t": "Khi có bất đồng, tôi thường im lặng, tấn công hay phòng vệ?", "k": "p"}, {"t": "Tôi có xu hướng nói dữ kiện hay gắn nhãn con người?", "k": "p"}, {"t": "Điều gì khiến tôi sợ nhất khi phải nói một điều khó?", "k": "p"}, {"t": "Tôi có thể nói rõ hơn ở điểm nào mà vẫn giữ được sự tôn trọng?", "k": "p"}]}, {"h": "KẾT THÚC", "practice": false, "items": [{"t": "Niềm tin không có nghĩa là không bao giờ có xung đột.", "k": "p"}, {"t": "Niềm tin được xây dựng khi hai người biết rằng:", "k": "p"}, {"t": "Ngay cả khi bất đồng, chúng ta vẫn có thể nói thật, lắng nghe và tôn trọng nhau.", "k": "p"}, {"t": "Ở bài tiếp theo, chúng ta sẽ khám phá một cấp độ ảnh hưởng sâu hơn: Vì sao muốn thay đổi người khác, trước hết phải bắt đầu từ cách mình hiện diện và hành động?", "k": "p"}, {"t": "QUOTE KẾT THÚC: “Giao tiếp tạo niềm tin là khả năng nói rõ điều cần nói mà không phủ nhận phẩm giá của người đang nghe.”", "k": "p"}]}]}, {"n": 25, "module": 3, "title": "ẢNH HƯỞNG BẰNG CHÍNH CON NGƯỜI BẠN", "subtitle": "Bạn không tạo ảnh hưởng bằng những gì bạn nói. Bạn tạo ảnh hưởng bằng con người bạn đang là\n Thời lượng: 6–7 phút", "duration": "", "objectives": ["Hiểu triết lý Leadership From Inside Out.tạo ảnh hưởng bằng con người bạn đang là\n)", "Hiểu sự khác nhau giữa vòng tròn quan tâm và vòng tròn ảnh hưởng.", "Nhận biết cảm xúc và hành vi của mình luôn lan tỏa đến người khác.", "Biết cách tạo ảnh hưởng bằng sự hiện diện và làm gương.", "Thiết kế một hành động để trở thành hình mẫu trong gia đình hoặc công việc."], "sections": [{"h": "", "practice": false, "items": [{"t": "OUTCOMES", "k": "p"}]}, {"h": "WHY · Vì sao", "practice": false, "items": [{"t": "Có bao giờ bạn rơi vào những tình huống như thế này?", "k": "p"}, {"t": "Muốn con bình tĩnh, nhưng chính mình lại quát mắng.", "k": "p"}, {"t": "Muốn nhân viên chủ động, nhưng mọi việc đều phải chờ mình quyết định.", "k": "p"}, {"t": "Muốn người khác lắng nghe, nhưng mình luôn cắt lời.", "k": "p"}, {"t": "Muốn đội nhóm tích cực, nhưng mình là người than phiền nhiều nhất.", "k": "p"}, {"t": "Chúng ta thường nghĩ:", "k": "p"}, {"t": "\"Nếu người kia thay đổi thì mọi chuyện sẽ tốt hơn.\"", "k": "p"}, {"t": "Nhưng thực tế là:", "k": "p"}, {"t": "Con người học nhiều hơn từ điều họ nhìn thấy so với điều họ được nghe.", "k": "p"}, {"t": "Lãnh đạo không bắt đầu bằng việc thay đổi người khác.", "k": "p"}, {"t": "Lãnh đạo bắt đầu bằng việc thay đổi chính mình.", "k": "p"}]}, {"h": "WHAT · Là gì", "practice": false, "items": [{"t": "Leadership From Inside Out", "k": "p"}, {"t": "Ảnh hưởng thật sự không đến từ:", "k": "p"}, {"t": "Chức vụ.", "k": "p"}, {"t": "Quyền lực.", "k": "p"}, {"t": "Kiến thức.", "k": "p"}, {"t": "Khả năng thuyết phục.", "k": "p"}, {"t": "Ảnh hưởng đến từ: Con người bạn đang là mỗi ngày.", "k": "p"}, {"t": "Người khác luôn quan sát:", "k": "p"}, {"t": "Bạn phản ứng khi gặp áp lực.", "k": "p"}, {"t": "Bạn cư xử khi bất đồng.", "k": "p"}, {"t": "Bạn giữ lời hứa hay không.", "k": "p"}, {"t": "Bạn đối xử với người yếu thế như thế nào.", "k": "p"}, {"t": "Đó mới là lãnh đạo.", "k": "p"}, {"t": "Vòng tròn quan tâm và vòng tròn ảnh hưởng", "k": "p"}, {"t": "Có rất nhiều điều chúng ta quan tâm.", "k": "p"}, {"t": "Thái độ của người khác.", "k": "p"}, {"t": "Thị trường.", "k": "p"}, {"t": "Khách hàng.", "k": "p"}, {"t": "Thời tiết.", "k": "p"}, {"t": "Chính sách.", "k": "p"}, {"t": "Nhưng không phải điều gì cũng nằm trong khả năng tác động của mình.", "k": "p"}, {"t": "Điều chúng ta thực sự kiểm soát được là:", "k": "p"}, {"t": "Thái độ của chính mình.", "k": "p"}, {"t": "Hành vi của chính mình.", "k": "p"}, {"t": "Cách mình giao tiếp.", "k": "p"}, {"t": "Cách mình phản ứng.", "k": "p"}, {"t": "Khi tập trung vào điều mình có thể thay đổi, vòng tròn ảnh hưởng sẽ ngày càng mở rộng.", "k": "p"}, {"t": "Cảm xúc có tính lan truyền", "k": "p"}, {"t": "Cảm xúc không chỉ ở trong bạn. Nó lan sang người khác.", "k": "p"}, {"t": "Một người lãnh đạo bước vào phòng với sự bình tĩnh.", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "Đội nhóm bình tĩnh hơn.", "k": "p"}, {"t": "Một người mẹ trở về nhà với sự căng thẳng.", "k": "p"}, {"t": "↓", "k": "p"}, {"t": "Cả gia đình dễ căng thẳng hơn.", "k": "p"}, {"t": "Bạn luôn đang tạo ảnh hưởng.", "k": "p"}, {"t": "Câu hỏi chỉ là: Ảnh hưởng theo hướng nào?", "k": "p"}, {"t": "MÔ HÌNH TRỌNG TÂM", "k": "p"}]}, {"h": "HOW · Cách làm", "practice": false, "items": [{"t": "Quy let _ac,_audio;
function ac(){ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended'){ try{ _ac.resume().catch(()=>{}); }catch(e){} } return _ac; }
function tone(freq,dur,type,vol,when,slideTo){ try{ const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }catch(e){} }
function sfx(name){ if(!snd||!snd.sfx) return;
  if(name==='tap') tone(520,.07,'sine',.08,0,700);
  else if(name==='pop') tone(340,.09,'triangle',.1,0,500);
  else if(name==='send') tone(600,.12,'sine',.09,0,1000);
  else if(name==='success'){ tone(523,.12,'sine',.11); tone(659,.12,'sine',.11,.11); tone(784,.22,'sine',.11,.22); }
  else if(name==='chest'){ tone(392,.14,'triangle',.12); tone(523,.14,'triangle',.12,.12); tone(659,.14,'triangle',.12,.24); tone(784,.3,'triangle',.13,.36); }
  else if(name==='err') tone(220,.16,'sawtooth',.07,0,160);
}
function syncBgm(force){ if(!snd||!snd.bgm){ if(_audio&&!_audio.paused)_audio.pause(); return; } const t=TRACKS[snd.track]||TRACKS[0]; if(!_audio){ _audio=new Audio(); _audio.loop=true; } if((!_audio.src.endsWith(t.f))||force){ _audio.src=t.f; } _audio.loop=true; _audio.volume=(snd.vol==null?0.5:snd.vol); if(_audio.paused){ _audio.play().catch(()=>{}); } }
function setTrack(i){ snd.track=i; snd.bgm=true; saveSnd(); syncBgm(true); sfx('tap'); render(); }
function setVol(v){ snd.vol=v/100; saveSnd(); if(_audio) _audio.volume=snd.vol; const el=document.getElementById('volpct'); if(el) el.textContent=Math.round(snd.vol*100)+'%'; }

/* ===== STEPPER ===== */
let STEPS=null;
function buildSteps(n){
  const l=LESSONS[n], steps=[{kind:'intro'}];
  if(COMICS[n]) steps.push({kind:'comic', pages:COMICS[n]});
  const isHead=it=> it.k==='h' || (it.t && it.t.length<64 && it.t===it.t.toUpperCase() && /[A-ZÀ-Ỹ]/.test(it.t));
  l.sections.forEach(sec=>{ if(sec.practice) return; let page=[]; const flush=()=>{ if(page.length){ steps.push({kind:'content',h:sec.h,items:page}); page=[]; } };
    sec.items.forEach(it=>{ if(isHead(it)&&page.length) flush(); page.push({t:(it.t||'').replace(/=>/g,'→'), isHead:isHead(it), isFlow:!isHead(it)&&/→|⇒/.test(it.t||'')}); if(page.length>=STEP_LINES) flush(); }); flush(); });
  if(WORKBOOK[n]) steps.push({kind:'workbook', pages:WORKBOOK[n]});
  const ps=l.sections.find(s=>s.practice);
  if(ps) steps.push({kind:'practice', items:ps.items.map(it=>({t:it.t}))});
  else if(REFLECT_PROMPTS[n]!=null) steps.push({kind:'practice', items:[{t:REFLECT_PROMPTS[n]}], reflect:true});
  steps.push({kind:'finish'});
  return steps;
}
function openLesson(n){
  if(!unlocked(n)){ sfx('err'); if(BACKEND && !isPremium() && n>=1){ UI.premOpen=true; render(); } else toast('Hoàn thành buổi tập trước để mở khóa buổi này nhé!'); return; }
  sfx('tap'); STEPS=buildSteps(n);
  UI.view='lesson'; UI.n=n; UI.step=0; UI.grading=false; UI.mp4Ok=null; UI.scenLoading=false;
  const v=VIDEO_MAP[n]||{};
  if(!ytId(v.yt||'') && v.mp4){ fetch(v.mp4,{method:'HEAD'}).then(r=>{ if(UI.n===n){ UI.mp4Ok=r.ok; render(); } }).catch(()=>{ if(UI.n===n){ UI.mp4Ok=false; render(); } }); }
  render(); window.scrollTo(0,0);
}
function goHome(){ UI.view='home'; render(); window.scrollTo(0,0); }
function goStep(d){ sfx('pop'); UI.step=Math.max(0,Math.min(STEPS.length-1,UI.step+d)); render(); window.scrollTo(0,0); }
function stepIdx(kind){ return STEPS.findIndex(s=>s.kind===kind); }

/* ===== ĐỒNG BỘ VIDEO GOOGLE DRIVE ===== */
function gdLessonNum(name){
  const base=(name||'').replace(/\.[a-z0-9]+$/i,'');
  let m=base.match(/(?:bu[oổ]i|b[aà]i)\s*[-_. ]?\s*(\d{1,2})/i); if(m) return +m[1];
  if(/^\s*\d{1,2}\s*$/.test(base)) return +base.trim();
  m=base.match(/\b(\d{1,2})\b/); if(m){ const v=+m[1]; if(v>=0&&v<=29) return v; }
  return null;
}
async function syncDriveVideos(){
  if(!GDRIVE_API_KEY || !GDRIVE_FOLDERS.length) return;
  try{
    const map={};
    for(const fid of GDRIVE_FOLDERS){
      const q="'"+fid+"' in parents and mimeType contains 'video/' and trashed=false";
      const url="https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&key="+encodeURIComponent(GDRIVE_API_KEY)+"&fields=files(id,name)&pageSize=1000";
      const r=await fetch(url); if(!r.ok){ console.warn('drive folder '+fid+' HTTP '+r.status); continue; }
      const j=await r.json();
      (j.files||[]).forEach(f=>{ const n=gdLessonNum(f.name); if(n!=null && map[n]==null) map[n]=f.id; });
    }
    if(Object.keys(map).length){ GD_VIDEOS=map; try{ localStorage.setItem('eqgym_gdvideos',JSON.stringify(map)); }catch(e){} if(UI.view==='lesson') render(); }
  }catch(e){ console.warn('syncDriveVideos',e); }
}
function hasVideo(n){ const v=VIDEO_MAP[n]||{}; return !!(v.yt||v.gd||v.mp4||GD_VIDEOS[n]); }
function videoFor(n){
  const v=VIDEO_MAP[n]||{}; const id=ytId(v.yt||'');
  if(id) return {type:'yt',id};
  const gd=v.gd||GD_VIDEOS[n]; if(gd) return {type:'gd',id:gd};
  if(v.mp4 && UI.mp4Ok!==false) return {type:'mp4',src:v.mp4};
  return {type:'none'};
}

  if(S.last!==today){ const y=new Date(Date.now()-86400000).toDateString(); S.streak=(S.last===y)?S.streak+1:1; S.last=today; }
  save(); confettiRain(); sfx('chest');
  const d=S.done.length, r=rankOf(d), pr=rankOf(d-1);

  if(S.history[n].length>50) S.history[n]=S.history[n].slice(0,50);

async function gradeGemini(l,prompt,ans,scen,focus){
  const scenLine=scen?`\nTÌNH HUỐNG/CÂU HỎI ĐANG LUYỆN: ${scen.slice(0,700)}`:'';
  const body={contents:[{parts:[{text:
`Bạn là "Coach AI" của EQ GYM — huấn luyện viên trí tuệ cảm xúc (EQ) chuyên nghiệp, khoa học, ấm áp và thẳng thắn, nói tiếng Việt, xưng "Coach", gọi học viên là "bạn".
Chấm bài thực hành EQ theo KHUNG 4 TRỤ CỘT, MỖI TRỤ 0-25 điểm:
1. aware — Nhận thức: gọi tên được cảm xúc/mô thức/giá trị/động cơ của bản thân.
2. real — Chân thật & Cụ thể: tình huống thật, chi tiết, không chung chung.
3. choice — Làm chủ & Lựa chọn: thể hiện điều tiết cảm xúc và chọn phản ứng có ý thức.
4. empath — Thấu cảm & Ứng dụng: hiểu người khác / áp dụng được vào đời thực.
Trọng tâm bài học này là trụ "${PILLAR_MAP[focus]||'Nhận thức'}" — hãy nhấn mạnh nó. Chấm công tâm.

BÀI HỌC: ${l.title}
MỤC TIÊU: ${(l.objectives&&l.objectives.join('; '))||l.subtitle||''}
ĐỀ THỰC HÀNH: ${prompt}${scenLine}
BÀI LÀM: """${ans.slice(0,2500)}"""

Trả về DUY NHẤT JSON: {"aware":<0-25>,"real":<0-25>,"choice":<0-25>,"empath":<0-25>,"feedback":"<3-4 câu giọng Coach ấm áp, khen trụ mạnh, chỉ trụ cần luyện>","tip":"<1 gợi ý nâng trụ yếu nhất>"}`}]}],
    generationConfig:{temperature:0.6,responseMimeType:'application/json'}};
  const j=await geminiFetch(body); const o=JSON.parse(j.candidates[0].content.parts[0].text);
  const dims=clampDims(o); const score=dims.aware+dims.real+dims.choice+dims.empath;
  return {score,dims,feedback:o.feedback||'',tip:o.tip||'',by:'ai'};
}
function gradeOffline(ans,focus){
  const t=ans.toLowerCase(), len=ans.length, cnt=arr=>arr.filter(w=>t.includes(w)).length;
  const emo=['vui','buồn','giận','lo lắng','lo','sợ','tức','hạnh phúc','thất vọng','biết ơn','tổn thương','bình an','xấu hổ','tự hào','cô đơn','hào hứng','áp lực','bối rối','nặng nề'];
  const refl=['mình','tôi','nhận ra','cảm thấy','tự hỏi','bên trong','thói quen','giá trị','mô thức','hiểu ra'];
  const spec=['hôm nay','sáng nay','hôm qua','tối qua','lúc','khi ','vừa ','đã '];
  const ch=['chọn','thay vì','quyết định','cần','sẽ','lần sau','dừng lại','hít thở','bình tĩnh','kiểm soát','đáp lại'];
  const emp=['người khác','bạn ấy','họ','lắng nghe','xin lỗi','thấu hiểu','đồng cảm','áp dụng','chia sẻ','tôn trọng','ranh giới','gia đình','đồng nghiệp','con','vợ','chồng'];
  let dims={aware:cl25(5+cnt(emo)*3+cnt(refl)*2),real:cl25(5+Math.floor(len/45)+cnt(spec)*3),choice:cl25(6+cnt(ch)*4),empath:cl25(6+cnt(emp)*4)};
  if(focus&&dims[focus]!=null) dims[focus]=cl25(dims[focus]+1);
  const score=dims.aware+dims.real+dims.choice+dims.empath;
  const arr=PILLARS.map(p=>({p,v:dims[p.k]})).sort((a,b)=>b.v-a.v);
  const strong=arr[0].p.name, weak=arr[3].p, weakName=weak.name;
  let fb,tip;
  if(score>=80){ fb=`Bài chất lượng lắm! Coach thấy bạn mạnh nhất ở "${strong}". Giữ phong độ này nhé.`; tip=`Nâng thêm trụ "${weakName}": ${tipFor(weak.k)}`; }
  else if(score>=55){ fb=`Khá tốt! Bạn chịu viết thật. Điểm sáng là "${strong}", nhưng trụ "${weakName}" còn mỏng — hãy đào sâu hơn.`; tip=`Luyện trụ "${weakName}": ${tipFor(weak.k)}`; }
  else { fb=`Chưa đủ độ sâu bạn ơi. Viết ngắn quá thì chưa luyện được cơ bắp cảm xúc. Trụ yếu nhất của bạn là "${weakName}".`; tip=`Bắt đầu từ trụ "${weakName}": ${tipFor(weak.k)}`; }
  return {score,dims,feedback:fb,tip,by:'off'};
}
function pillarBarsHtml(dims,scale){
  if(!dims) return '';
  const mx=scale||25;
  return `<div style="margin:11px 0 2px">`+PILLARS.map(p=>{ const v=dims[p.k]!=null?dims[p.k]:0; const pct=Math.round(v/mx*100);
    return `<div class="pbar"><span class="pl">${p.name}</span><span class="ptrk"><i style="width:${pct}%"></i></span><b>${(typeof v==='number'&&v%1)?v.toFixed(1):v}</b></div>`; }).join('')+`</div>`;
}

/* ===== HỒ SƠ EQ (RADAR) ===== */
function eqProfile(){
  let sums={aware:0,real:0,choice:0,empath:0}, cnt=0;
  Object.values(S.history||{}).forEach(arr=>arr.forEach(it=>{ if(it.dims){ cnt++; PILLARS.forEach(p=>sums[p.k]+=(it.dims[p.k]||0)); } }));
  if(!cnt) return null; const avg={}; PILLARS.forEach(p=>avg[p.k]=sums[p.k]/cnt); return {avg,cnt};
}
function eqRadarSVG(avg,mx){
  mx=mx||25; const order=[{k:'aware',a:-90},{k:'choice',a:0},{k:'empath',a:90},{k:'real',a:180}]; const cx=100,cy=100,R=70;
  const pt=(v,a)=>{ const r=v/mx*R, rad=a*Math.PI/180; return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)]; };
  let grid=''; [0.25,0.5,0.75,1].forEach(f=>{ grid+=`<polygon points="${order.map(o=>pt(mx*f,o.a).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#D7DEE6"/>`; });
  let axes=''; order.forEach(o=>{ const p=pt(mx,o.a); axes+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#D7DEE6"/>`; });
  const poly=order.map(o=>pt(avg[o.k],o.a).map(x=>x.toFixed(1)).join(',')).join(' ');
  const dots=order.map(o=>{ const p=pt(avg[o.k],o.a); return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#0A6E5D"/>`; }).join('');
  return `<svg viewBox="0 0 200 205" class="radar" style="width:168px;height:172px">${grid}${axes}<polygon points="${poly}" fill="rgba(15,184,155,.22)" stroke="#0FB89B" stroke-width="2"/>${dots}<text x="100" y="15" text-anchor="middle" class="rlab">Nhận thức</text><text x="184" y="104" text-anchor="end" class="rlab">Làm chủ</text><text x="100" y="199" text-anchor="middle" class="rlab">Thấu cảm</text><text x="16" y="104" text-anchor="start" class="rlab">Chân thật</text></svg>`;
}

  const t=text.toLowerCase(); const nextN=[...Array(30).keys()].find(n=>!isDone(n)); const nx=nextN!=null?('Buổi '+nextN+' — '+LESSONS[nextN].title):'đã hoàn thành hết 30 buổi';

  if(/căng thẳng|stress|lo|buồn|giận|mệt|áp lực|tức/.test(t)) return `Coach nghe thấy rồi. Khi cảm xúc dâng cao, đừng chống lại — hãy thở: hít 4 nhịp, giữ 4 nhịp, thở ra 6 nhịp, làm 3 lần. Rồi gọi tên cảm xúc: "Mình đang thấy ___ vì ___". Chỉ gọi tên thôi đã làm cơn sóng dịu đi một nửa.`;
  if(/tình huống|luyện|thực hành|bài tập/.test(t)) return `Muốn luyện thì mở một buổi bất kỳ, kéo tới Phòng Tập Tình Huống rồi bấm nút nhận tình huống — Coach sẽ dựng cho bạn một tình huống đời thực để phản ứng và chấm điểm.`;
  return `Coach luôn ở đây. Để trò chuyện thật sâu và cá nhân hóa, hãy thêm API key Gemini (miễn phí) ở mục Tài khoản. Còn bây giờ: cứ vào ${nx} và tập đều mỗi ngày — đó là cách cơ bắp cảm xúc lớn lên.`;
}

function eqBand(t){ return t>=80?'Bậc Thầy Cảm Xúc':t>=60?'Hội Viên Cảm Xúc Tốt':t>=40?'Đang Rèn Luyện':'Người Mới Bắt Đầu'; }
function bandEmoji(t){ return t>=80?'◆':t>=60?'◈':t>=40?'◇':'○'; }
function scoreQuiz(ans){ const P={aware:[],real:[],choice:[],empath:[]}; QUIZ.forEach(q=>{ let v=+ans[q.id]||0; if(!v) return; if(q.rev) v=6-v; P[q.pillar].push(v); }); const norm=a=>a.length?Math.round((a.reduce((x,y)=>x+y,0)-a.length)/(a.length*4)*100):0; const s={aware:norm(P.aware),real:norm(P.real),choice:norm(P.choice),empath:norm(P.empath)}; s.total=Math.round((s.aware+s.real+s.choice+s.empath)/4); s.band=eqBand(s.total); return s; }
function ansQuiz(id,v){ S.qans[id]=v; save(); sfx('tap'); render(); }
function submitQuiz(){ const n=QUIZ.filter(q=>S.qans[q.id]).length; if(n<QUIZ.length){ const first=QUIZ.find(q=>!S.qans[q.id]); toast('Còn '+(QUIZ.length-n)+' câu chưa trả lời'); const el=document.getElementById('qi-'+first.id); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); return; } const scores=scoreQuiz(S.qans); S.quiz={scores,answers:Object.assign({},S.qans),ts:Date.now()}; save(); pushAssessment(scores,S.quiz.answers); sfx('success'); render(); window.scrollTo(0,0); }
function retakeQuiz(){ S.qans={}; S.quiz=null; save(); render(); window.scrollTo(0,0); }
function bandSummary(t){ return t>=80?'Bạn có nền tảng EQ rất mạnh. Hành trình EQ GYM giúp bạn giữ phong độ và lan tỏa cho người khác.':t>=60?'Nền EQ của bạn tốt. Luyện đều mỗi ngày để biến nó thành phản xạ tự nhiên.':t>=40?'Bạn đã có ý thức cảm xúc. 30 buổi luyện tập sẽ nâng cơ bắp cảm xúc lên rõ rệt.':'Đây là điểm khởi đầu tuyệt vời — ai cũng bắt đầu từ buổi tập đầu tiên. EQ GYM sinh ra cho bạn.'; }
function strengthTip(k){ return {aware:'bạn hiểu rõ thế giới nội tâm của mình.',real:'bạn sống thật và dám đối diện cảm xúc.',choice:'bạn làm chủ phản ứng tốt dưới áp lực.',empath:'bạn kết nối và thấu cảm người khác tốt.'}[k]||''; }

    <div style="background:#fff;border:1px solid #E3E8EE;border-radius:18px;padding:16px 15px;margin-top:12px"><h3 style="margin:0 0 6px;font-family:'Space Grotesk';font-size:16px;font-weight:700">Đọc vị hành trình của bạn</h3><p style="margin:5px 0;color:#22303D;font-size:13.5px;line-height:1.6"><b style="color:#0A6E5D">Trụ mạnh nhất:</b> ${strong.p.name} (${strong.v}/100) — ${strengthTip(strong.p.k)}</p><p style="margin:5px 0;color:#22303D;font-size:13.5px;line-height:1.6"><b style="color:#E85B5B">Trụ cần luyện:</b> ${weak.p.name} (${weak.v}/100) — ${tipFor(weak.p.k)}</p><p style="margin:5px 0;color:#22303D;font-size:13.5px;line-height:1.6"><b style="color:#0A6E5D">Gợi ý bắt đầu:</b> ưu tiên vùng rèn "${weak.p.name}".${focusN!=null?(' Thử bắt đầu từ Buổi '+focusN+' — '+esc(LESSONS[focusN].title)+'.'):''}</p></div>`;
  let h=`<div style="text-align:center;padding:6px 0"><div style="width:120px;height:120px;margin:8px auto 4px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#0FB89B,#0A6E5D);border:4px solid #EAFBF6;box-shadow:0 10px 30px rgba(15,184,155,.28)"><b style="font-family:'Space Grotesk';font-size:38px;line-height:1;color:#fff">${s.total}</b><span style="font-size:11px;color:#BFEFE4">/100 EQ</span></div><div style="font-size:20px;font-weight:900;color:#0A6E5D;margin-top:6px;font-family:'Space Grotesk'">${em} ${s.band}</div><div style="font-size:13.5px;color:#5C6B7A;margin:6px auto;max-width:440px;line-height:1.6;font-weight:600">${bandSummary(s.total)}</div></div>`;
  if(canSee) h+=report;
  else h+=`<div style="position:relative;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid #E3E8EE"><div style="filter:blur(6px);opacity:.5;pointer-events:none;padding:14px">${report}</div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(245,248,250,.6);text-align:center;padding:18px"><div style="font-size:30px">🔒</div><b style="font-size:15px">Mở khóa báo cáo EQ chi tiết</b><p style="font-size:12.5px;color:#5C6B7A;margin:0;max-width:280px;font-weight:600">Đăng ký tài khoản miễn phí để xem điểm 4 trụ, biểu đồ radar và lộ trình luyện tập riêng cho bạn.</p><button onclick="openAuth()" style="border:none;border-radius:14px;padding:14px 22px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#0FB89B,#0A8C77);color:#fff">Đăng ký / Đăng nhập miễn phí</button></div></div>`;

  return h;
}

    <div style="margin-top:12px;background:#F5F8FA;border:1px solid #E3E8EE;border-radius:14px;padding:12px 13px"><div style="font-size:11px;color:#5C6B7A;font-weight:800;margin-bottom:6px;letter-spacing:.5px">HỌ TÊN IN TRÊN CHỨNG NHẬN</div><div style="display:flex;gap:8px"><input id="certname" value="${esc(c.name||'')}" placeholder="VD: Nguyễn Văn A" onkeydown="if(event.key==='Enter')saveCertName()" style="flex:1;min-width:0;background:#fff;border:1px solid #E3E8EE;border-radius:11px;padding:11px 12px;font-size:14px;font-weight:700"><button onclick="saveCertName()" style="flex:0 0 auto;border:none;border-radius:11px;padding:0 14px;font-size:12.5px;font-weight:800;cursor:pointer;background:#0F1923;color:#fff;min-height:44px">Cập nhật</button></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><a id="certdl" href="${UI.certImg||'#'}" download="${certFile()}" onclick="sfx('tap')" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:14px;font-size:14px;font-weight:800;background:linear-gradient(135deg,#E0930A,#C47A00);color:#fff;min-height:50px;opacity:${UI.certImg?1:.5}">⬇ Tải ảnh PNG</a><button onclick="shareCert()" style="flex:1;border:1px solid #E3E8EE;border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:#0F1923;min-height:50px">📤 Chia sẻ</button></div>
    <p style="font-size:11px;color:#8A97A5;font-weight:600;margin:10px 0 0;line-height:1.55;text-align:center">📱 Trên iPhone, nếu nút tải mở ảnh ra tab mới: nhấn giữ ảnh → "Lưu vào Ảnh". Chứng nhận lưu theo tài khoản — xem lại bất cứ lúc nào ở mục Tài khoản.</p>
  </div></div>`;
}

/* ===== HANDLERS ===== */
function toggleZone(m){ const cur=(function(){ const nextN=[...Array(30).keys()].find(n=>!isDone(n)); return nextN!=null?LESSONS[nextN].module:3; })(); const o=Object.assign({},UI.openZones||{[cur]:true}); o[m]=!o[m]; UI.openZones=o; render(); }
function onAns(){ const ta=document.getElementById('ans'); if(!ta||UI.n==null) return; S.ans[UI.n]=ta.value; save(); const m=document.getElementById('savedmsg'); if(m){ m.textContent='Đã lưu vào nhật ký ✓'; clearTimeout(window._sm); window._sm=setTimeout(()=>{ if(m) m.textContent=''; },1400); } }
function openSettings(){ renderAcctPre(); UI.settingsOpen=true; sfx('tap'); render(); }
function renderAcctPre(){ if(BACKEND) refreshAuthUI(); }
function saveKey(){ const k=(document.getElementById('apikey').value||'').trim(); try{ localStorage.setItem('eqgym_gemini_key',k); }catch(e){} UI.settingsOpen=false; render(); toast(k?'Coach AI đã sẵn sàng!':'Key trống — dùng chấm offline'); }
function clearKey(){ try{ localStorage.removeItem('eqgym_gemini_key'); }catch(e){} UI.settingsOpen=false; render(); toast('Đã xóa key'); }
function clearChat(){ if(confirm('Xóa toàn bộ hội thoại với Coach AI?')){ S.chat=[]; save(); render(); } }

/* ===== BOOT ===== */
document.addEventListener('pointerdown',function once(){ syncBgm(); }, {once:false});
async function boot(){
  if(BACKEND){ try{ await initAuth(); }catch(e){ console.warn(e); } }
  if(CODE_MODE && OPEN_MODE){ const g=guestStored(); if(g&&g.email){ try{ const d=await api({action:'guest',name:g.name,email:g.email}); if(d&&d.ok){ MEMBER={code:d.code,name:d.name,role:'guest',session:d.session||'',email:g.email}; try{ localStorage.setItem('eqgym_guest',JSON.stringify({code:d.code,session:d.session,name:d.name,email:g.email})); }catch(e){} if(d.progress) applyProgress(d.progress); } else { try{ localStorage.removeItem('eqgym_guest'); }catch(e){} } }catch(e){} } }
  else if(CODE_MODE){ const c=memberCode(); if(c){ try{ const d=await api({action:'login',code:c}); if(d&&d.ok){ MEMBER={code:c,name:d.name,points:d.points||0,role:d.role,session:d.session||''}; try{localStorage.setItem('eqgym_session',MEMBER.session||'');}catch(e){} if(d.role==='member'){ if(d.progress) applyProgress(d.progress); else S.bounty=d.points||0; startHeartbeat(); } } else { try{ localStorage.removeItem('eqgym_code'); localStorage.removeItem('eqgym_session'); }catch(e){} } }catch(e){} } }
  if(!CODE_MODE && !S.quiz && (!S.done||!S.done.length)){ UI.view='quiz'; }
  render();
  syncDriveVideos();
}
boot();
</script>
